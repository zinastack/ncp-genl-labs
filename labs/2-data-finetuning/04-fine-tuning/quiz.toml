domain = "Fine-Tuning"
code = "04"
weight = 13

[[questions]]
id = "04-01"
topic = "LoRA initialisation"
question = "Why is the LoRA B matrix initialised to zeros while A is initialised randomly?"
options = [
  "So the low-rank update BA is zero at the start and the adapted model exactly matches the pre-trained model, while gradients can still flow to B",
  "To make the adapter weights sparse for faster inference",
  "Because A and B are merged into the base weights before training starts",
  "To prevent the base model's weights from being updated",
]
answer = ["A"]
explanation = """
With B = 0 the product BA is zero, so fine-tuning starts exactly from the base model's
behaviour. Because A is random, the gradient with respect to B is non-zero and learning starts
immediately. If both were zero, neither would receive a gradient. Freezing the base weights is
a separate step (requires_grad = False). Merging happens after training.
"""

[[questions]]
id = "04-02"
topic = "LoRA parameter count"
question = """
You apply LoRA with rank r=16 to the q_proj and v_proj matrices (each 4096×4096) in all 32 layers
of a 7B model. Roughly how many trainable parameters is that?
"""
options = ["About 8.4 million", "About 134 million", "About 1 million", "About 7 billion"]
answer = ["A"]
explanation = """
Each adapted matrix adds r·(d_in + d_out) = 16 × 8192 = 131,072 parameters. That's 2 matrices ×
32 layers = 64 matrices, so 64 × 131,072 ≈ 8.39M, about 0.12% of 7B. That tiny fraction is why
LoRA's optimizer state and checkpoints are so small.
"""

[[questions]]
id = "04-03"
topic = "QLoRA"
question = """
A team must fine-tune a 65B model on a single 48 GB GPU. Which approach makes this feasible, and
why?
"""
options = [
  "QLoRA: store the frozen base model in 4-bit NF4 (about 33 GB) and train bf16 LoRA adapters, with paged optimizers absorbing memory spikes",
  "Full fine-tuning in fp16 with gradient checkpointing",
  "LoRA with the base model in fp32 to avoid precision loss",
  "Prompt engineering with 100 few-shot examples",
]
answer = ["A"]
explanation = """
65B parameters at 4 bits is about 33 GB, which leaves room for adapters, activations and
optimizer state for the adapters only. Full fine-tuning needs roughly 16 bytes per parameter
(over 1 TB). fp32 weights alone would be 260 GB. Prompting isn't fine-tuning. QLoRA saves memory
at the cost of some dequantisation overhead per step.
"""

[[questions]]
id = "04-04"
topic = "Loss masking"
question = """
After SFT on a chat dataset, the model sometimes generates text that looks like the next user
question instead of answering. Which data-collation mistake most likely caused this?
"""
options = [
  "The loss was computed on all tokens, including user/prompt tokens, instead of masking them with ignore_index (-100)",
  "The learning rate was too low",
  "The EOS token was masked in the labels",
  "The dataset was shuffled",
]
answer = ["A"]
explanation = """
If prompt tokens contribute to the loss, the model is also trained to produce user turns.
Standard SFT sets prompt labels to -100 so only assistant tokens are learned. Masking EOS would
cause a different failure: the model never learns to stop and rambles. A low learning rate
under-fits but doesn't teach the model to write user turns.
"""

[[questions]]
id = "04-05"
topic = "Choosing a method"
question = """
A semiconductor company wants its LLM to understand proprietary chip-design terminology found in
10 billion tokens of internal documents, then follow engineering Q&A instructions. Which
sequence is most appropriate?
"""
options = [
  "Domain-adaptive continued pre-training on the internal corpus, then supervised fine-tuning on domain instruction data",
  "SFT only, on 500 Q&A pairs",
  "DPO on the raw documents",
  "Prompt engineering with the glossary pasted into every prompt",
]
answer = ["A"]
explanation = """
Large unlabelled domain corpora teach vocabulary and knowledge through continued pre-training
(DAPT), which is what NVIDIA's ChipNeMo did. SFT then teaches instruction following on that
domain. A few hundred SFT examples can't inject billions of tokens of knowledge. DPO needs
preference pairs, not raw text. A pasted glossary helps a little but doesn't scale.
"""

[[questions]]
id = "04-06"
topic = "DPO vs RLHF"
question = "What is the main practical advantage of DPO over PPO-based RLHF?"
options = [
  "DPO optimises the policy directly from preference pairs with a classification-style loss, with no separate reward model and no RL sampling loop",
  "DPO doesn't need preference data",
  "DPO updates only the embedding layer",
  "DPO removes the need for a reference model",
]
answer = ["A"]
explanation = """
DPO reparameterises the RLHF objective, so the optimal policy can be trained with a simple
logistic loss on chosen versus rejected log-prob margins. That makes it simpler, more stable and
cheaper than training a reward model and running PPO. It still needs preference pairs and a
frozen reference model; β controls the implicit KL constraint.
"""

[[questions]]
id = "04-07"
topic = "Catastrophic forgetting"
question = """
After full fine-tuning on a narrow customer-service dataset for 10 epochs, the model loses
general reasoning ability. Which changes reduce this? (Select TWO.)
"""
options = [
  "Use a PEFT method such as LoRA so the base weights stay frozen",
  "Mix general instruction data into the fine-tuning set and train fewer epochs",
  "Increase the learning rate so training converges faster",
  "Remove the validation set to use more data",
  "Train for more epochs so the model fully adapts",
]
answer = ["A", "B"]
explanation = """
Freezing the base weights and training a low-rank update limits how far the model moves from
its general abilities. Replaying general data and training for fewer epochs does the same. A
higher learning rate and more epochs increase drift. Without a validation set you can't detect
overfitting.
"""

[[questions]]
id = "04-08"
topic = "Multi-LoRA serving"
question = """
A SaaS platform needs 40 customer-specific variants of the same 8B base model with isolated
behaviour. Which approach minimises GPU memory while serving all of them?
"""
options = [
  "Train one LoRA adapter per customer and serve them on one shared base model with dynamic adapter selection per request (multi-LoRA in NIM or TensorRT-LLM)",
  "Fully fine-tune 40 copies and deploy each on its own GPU",
  "Merge all 40 adapters into one set of weights",
  "Use one model and add the customer's name to the prompt",
]
answer = ["A"]
explanation = """
Adapters are tiny (MBs), so one resident base model can serve many adapters, chosen per request
and batched together. NIM and TensorRT-LLM support this. Forty full copies multiply memory 40×.
Merging all adapters mixes their behaviours and loses isolation. A name in the prompt doesn't give
customer-specific learned behaviour.
"""

[[questions]]
id = "04-09"
topic = "LoRA hyperparameters"
question = """
LoRA fine-tuning with r=8 on attention projections only under-fits a complex code-generation
task. Which adjustments most likely increase adapter capacity? (Select TWO.)
"""
options = [
  "Increase the rank (for example to 32 or 64) and adjust alpha accordingly",
  "Also target the MLP projections (gate_proj, up_proj, down_proj)",
  "Decrease the rank to 2",
  "Freeze lora_A as well as the base weights",
  "Switch to prompt tuning with 5 virtual tokens",
]
answer = ["A", "B"]
explanation = """
Rank sets the dimension of the update subspace, and adding the MLP matrices, which hold about
two thirds of the parameters, gives the adapter more places to change behaviour. A lower rank or
a frozen A reduces capacity. Five virtual tokens of prompt tuning has far less capacity than LoRA.
"""

[[questions]]
id = "04-10"
topic = "Merging adapters"
question = "What is the effect of merging a trained LoRA adapter into the base weights before deployment?"
options = [
  "Inference latency matches the base model because W' = W + (α/r)BA is a single dense matrix, but you can no longer hot-swap adapters on that copy",
  "The model becomes smaller than the base model",
  "Accuracy increases compared with the unmerged adapter",
  "The model must be retrained after merging",
]
answer = ["A"]
explanation = """
Merging folds the low-rank update into W, which removes the extra adapter matmuls. The output is
mathematically identical (up to precision) and the size equals the base model. The trade-off is
flexibility: a merged copy serves one adapter. Unmerged adapters allow per-request switching.
"""

[[questions]]
id = "04-11"
topic = "Learning rates"
question = "Which learning rates are typical starting points for LoRA versus full fine-tuning of a 7B LLM?"
options = [
  "LoRA about 1e-4 to 2e-4; full fine-tuning about 1e-5 to 2e-5",
  "LoRA about 1e-6; full fine-tuning about 1e-3",
  "Both about 1e-2",
  "LoRA about 1.0; full fine-tuning about 0.1",
]
answer = ["A"]
explanation = """
The adapter starts at zero and is small, so LoRA tolerates and needs a higher learning rate,
roughly 10× that of full fine-tuning. Full fine-tuning at high rates quickly destroys pre-trained
knowledge. The other values are too high for LLMs or inverted.
"""

[[questions]]
id = "04-12"
topic = "Task-specific adaptation"
question = """
You need a low-latency classifier that routes support tickets into 12 fixed categories, with
20k labelled examples. Which approach usually gives the best cost/accuracy trade-off?
"""
options = [
  "Fine-tune a small encoder (for example DeBERTa or BERT) with a classification head",
  "Prompt a 70B generative model zero-shot for each ticket",
  "Fully fine-tune a 70B model to generate the category name",
  "Train a new tokenizer on the tickets",
]
answer = ["A"]
explanation = """
For fixed-label classification with plenty of labels, a fine-tuned encoder with a softmax head
is accurate and far cheaper and faster at inference than a large generative model. A 70B model
costs much more per request, and full fine-tuning one is excessive. A new tokenizer doesn't solve
the task.
"""

[[questions]]
id = "04-13"
topic = "P-tuning"
question = "In NVIDIA NeMo, what does p-tuning train?"
options = [
  "A small prompt encoder (LSTM/MLP) that produces continuous virtual-token embeddings prepended to the input, while the LLM stays frozen",
  "All the LLM's attention weights",
  "A reward model for RLHF",
  "A new tokenizer vocabulary",
]
answer = ["A"]
explanation = """
P-tuning is a PEFT method. A small prompt encoder generates soft prompt embeddings (virtual
tokens) that are optimised by gradient descent. After training, the virtual tokens can be cached
and the encoder discarded. The base model isn't changed, and it has nothing to do with reward
models or tokenizers.
"""

[[questions]]
id = "04-14"
topic = "Evaluation after fine-tuning"
question = """
After LoRA fine-tuning a model for insurance claims summarisation, what should the evaluation
plan include? (Select TWO.)
"""
options = [
  "Task metrics on a held-out, deduplicated test set (for example ROUGE and human or LLM-judge faithfulness ratings)",
  "Regression checks on general benchmarks and safety tests to detect forgetting and alignment loss",
  "Training loss only, since it measures generalisation",
  "Evaluation on the training examples to confirm memorisation",
  "Only the model's perplexity on Wikipedia",
]
answer = ["A", "B"]
explanation = """
A sound plan measures the target task on unseen data, including faithfulness for summaries, and
checks that fine-tuning didn't degrade general capabilities or safety behaviour. Training loss
and scores on training examples measure fit, not generalisation. Wikipedia perplexity alone
doesn't reflect task quality.
"""

[[questions]]
id = "04-15"
topic = "SFT data size"
question = """
A team has 800 high-quality, diverse instruction–response pairs written by experts for a
specific writing style. Which statement is most accurate?
"""
options = [
  "A small curated set can be enough to teach format and style through SFT or LoRA, because quality and diversity matter more than volume for alignment-style fine-tuning",
  "SFT needs at least 1 million examples to have any effect",
  "The pairs are useful only for continued pre-training",
  "The pairs should be augmented by duplicating each example 100 times",
]
answer = ["A"]
explanation = """
Work such as LIMA (about 1k curated examples) showed that style and format alignment needs
relatively little high-quality data, because knowledge comes from pre-training. Duplicating
examples causes overfitting and memorisation. Continued pre-training uses raw text, not
instruction pairs.
"""

[[questions]]
id = "04-16"
topic = "RLHF components"
question = "Which components are needed for classic PPO-based RLHF? (Select TWO.)"
options = [
  "A reward model trained on human preference comparisons",
  "A frozen reference (SFT) model for a KL penalty that keeps the policy from drifting",
  "A new tokenizer trained on the preference data",
  "A retrieval index of the training corpus",
  "Removal of the value/critic network to save memory",
]
answer = ["A", "B"]
explanation = """
PPO-RLHF uses the policy, a value (critic) network, a reward model and a reference model. The
reward model scores generations. The KL penalty to the reference model prevents reward hacking
and loss of language quality. Tokenizers and retrieval indexes aren't part of it. PPO needs the
critic. GRPO-style methods drop it, but that isn't classic PPO.
"""

[[questions]]
id = "04-17"
topic = "NF4"
question = "Why does QLoRA's NF4 data type use non-uniformly spaced quantization levels?"
options = [
  "Non-uniform levels are faster to decode on GPUs",
  "Pre-trained weights are roughly normally distributed, so placing the 16 levels at normal-distribution quantiles puts more of them where most weights are (near zero), which lowers quantization error",
  "Uniform levels cannot represent negative numbers",
  "NF4 levels are learned during fine-tuning",
]
answer = ["B"]
explanation = """
With only 16 levels, spacing matters. NF4 levels are quantiles of a normal distribution (dense near
0, sparse in the tails), matching the bell-shaped weights, so average error is lower than with 16
evenly spaced levels at the same 4 bits. Speed isn't the motivation, uniform grids handle negative
numbers fine, and the levels are fixed, not learned.
"""

[[questions]]
id = "04-18"
topic = "Double quantization"
question = "In QLoRA, what does double quantization do?"
options = [
  "Quantizes the LoRA adapters to 4 bits as well",
  "Quantizes activations and weights separately",
  "Quantizes the per-block scaling constants (absmax values) themselves, saving roughly 0.37 bits per parameter",
  "Runs quantization twice to reduce error",
]
answer = ["C"]
explanation = """
Each block of 64 weights stores a scale. At 32 bits that's 0.5 extra bits per weight. Quantizing
those scales to 8 bits (with a second-level scale) cuts the overhead to about 0.13 bits, bringing
the total to about 4.13 bits per weight. The adapters stay in bf16, activations aren't quantized,
and running quantization twice would not reduce error.
"""

[[questions]]
id = "04-19"
topic = "QLoRA trade-offs"
question = "Compared with LoRA on a bf16 base model, what is the typical effect of QLoRA?"
options = [
  "Much lower GPU memory for the frozen weights, but each training step is usually somewhat slower because weights are dequantized on the fly",
  "Faster training steps and higher accuracy in all cases",
  "Lower memory for the adapters only; the base model memory is unchanged",
  "Identical memory, but the adapters become 4-bit",
]
answer = ["A"]
explanation = """
QLoRA stores the frozen base in 4-bit NF4 (about 4× smaller than bf16) and dequantizes blocks to
bf16 for each matmul, which adds compute. It trades speed for memory. Accuracy is close to bf16
LoRA but not guaranteed higher, and the adapters stay in bf16; the savings come from the base weights.
"""

[[questions]]
id = "04-20"
topic = "Paged optimizers"
question = "What problem do the paged optimizers used in QLoRA address?"
options = [
  "They make the optimizer converge in fewer steps",
  "They absorb short GPU-memory spikes (for example from long sequences) by moving optimizer state to CPU memory when needed, instead of crashing with out-of-memory errors",
  "They store the optimizer state in 4-bit NF4",
  "They split the optimizer across multiple GPUs",
]
answer = ["B"]
explanation = """
Paged optimizers use unified memory: when GPU memory runs short, optimizer pages are evicted to CPU
RAM and brought back later, smoothing out spikes. They don't change convergence, store state in
NF4, or shard across GPUs (that's ZeRO/FSDP, Lab 06).
"""

[[questions]]
id = "04-21"
topic = "PEFT methods"
question = "Which description matches IA³ (Infused Adapter by Inhibiting and Amplifying Inner Activations)?"
options = [
  "It inserts small bottleneck MLP layers after each sub-layer",
  "It learns low-rank matrices B·A added to the weights",
  "It learns small vectors that rescale keys, values and FFN activations element-wise, training even fewer parameters than LoRA",
  "It prepends trainable key/value vectors at every layer",
]
answer = ["C"]
explanation = """
IA³ multiplies activations by learned vectors, so its trainable parameters are only a few per
layer (about 0.01% of the model). Bottleneck MLPs are Houlsby adapters, B·A is LoRA, and
per-layer key/value vectors are prefix tuning.
"""

[[questions]]
id = "04-22"
topic = "Adapter latency"
question = """
Which PEFT method adds inference latency that cannot be removed by merging, because it inserts new
layers into the forward pass?
"""
options = [
  "LoRA",
  "DoRA",
  "Full fine-tuning",
  "Houlsby-style bottleneck adapters",
]
answer = ["D"]
explanation = """
Bottleneck adapters are extra small networks placed in sequence after sub-layers, so every token
must pass through them and they can't be folded into existing weights. LoRA and DoRA updates are
matrices of the same shape as W and can be merged for zero overhead. Full fine-tuning adds no
layers.
"""

[[questions]]
id = "04-23"
topic = "DoRA"
question = "How does DoRA (Weight-Decomposed Low-Rank Adaptation) differ from LoRA?"
options = [
  "It decomposes each weight into a magnitude and a direction, trains the magnitude directly and applies a LoRA update to the direction",
  "It uses 4-bit quantization for the base model",
  "It trains only the embedding layer",
  "It removes the need for a rank hyperparameter",
]
answer = ["A"]
explanation = """
DoRA separates how large a weight vector is from where it points, which makes low-rank updates
behave more like full fine-tuning. It can still be merged after training. 4-bit bases are QLoRA,
embedding-only training is a different technique, and DoRA still has a LoRA rank.
"""

[[questions]]
id = "04-24"
topic = "Prefix tuning"
question = "What distinguishes prefix tuning from prompt tuning?"
options = [
  "Prefix tuning trains all model weights",
  "Prefix tuning learns key/value vectors prepended at every transformer layer, while prompt tuning learns embeddings only at the input",
  "Prefix tuning only works with encoder models",
  "Prompt tuning requires more trainable parameters than prefix tuning",
]
answer = ["B"]
explanation = """
Prompt tuning adds soft tokens to the input embedding sequence only. Prefix tuning injects learned
vectors into the attention keys and values of every layer, which gives more influence (and more
parameters). Both keep the model frozen, and prefix tuning was designed for generation models.
"""

[[questions]]
id = "04-25"
topic = "Reward model"
question = "A reward model for RLHF is trained on pairs of (chosen, rejected) answers. What does it learn?"
options = [
  "To generate the chosen answer token by token",
  "The exact probability that a human will click on an answer",
  "To classify answers into fixed quality categories",
  "A scalar score such that chosen answers score higher than rejected ones, trained so that σ(r_chosen − r_rejected) is large (Bradley–Terry)",
]
answer = ["D"]
explanation = """
The reward model outputs one number per (prompt, answer). The pairwise loss only constrains
differences, so the scale is arbitrary, which is why RLHF adds a KL penalty and why reward
normalisation is common. It doesn't generate text, isn't calibrated to click probabilities, and
isn't trained on fixed categories.
"""

[[questions]]
id = "04-26"
topic = "Reward hacking"
question = """
During PPO-based RLHF, the policy's reward keeps rising while human raters find answers getting
longer, repetitive and sycophantic. What is happening, and which mechanism limits it?
"""
options = [
  "Reward hacking: the policy exploits flaws in the reward model; the KL penalty toward the reference (SFT) model keeps it from drifting too far",
  "Catastrophic forgetting; fix it with a higher learning rate",
  "Underfitting of the reward model; fix it by removing the reference model",
  "Tokenizer mismatch; fix it by retraining the tokenizer",
]
answer = ["A"]
explanation = """
A reward model is an imperfect proxy, and an optimiser will find its blind spots (length,
flattery). The KL term penalises distribution shift from the reference model, and better or
ensembled reward models help too. A higher learning rate or removing the reference makes drift
worse, and the tokenizer is unrelated.
"""

[[questions]]
id = "04-27"
topic = "DPO beta"
question = "In DPO, what is the effect of increasing β?"
options = [
  "It changes which answers are labelled as chosen",
  "It increases the learning rate of the reference model",
  "It sharpens the loss with respect to the preference margin, which strengthens the implicit KL constraint so the policy stays closer to the reference",
  "It disables the reference model",
]
answer = ["C"]
explanation = """
β scales the log-probability ratios inside the sigmoid. It plays the role of the KL coefficient in
the RLHF objective: larger β corresponds to a stronger pull toward the reference. With larger β the
loss saturates at smaller policy changes (at a margin of 4, the loss is 0.513 with β = 0.1 but 0.127
with β = 0.5). The labels come from the data, and the reference model is frozen and always used.
"""

[[questions]]
id = "04-28"
topic = "SteerLM"
question = "What is distinctive about NVIDIA's SteerLM alignment technique?"
options = [
  "It removes the need for any labelled data",
  "It trains the model conditioned on attribute labels (such as helpfulness or verbosity), so users can adjust those attributes at inference time",
  "It is a quantization method",
  "It replaces the tokenizer with a steerable one",
]
answer = ["B"]
explanation = """
SteerLM uses attribute-annotated data and conditions generation on the desired attribute values,
so behaviour can be steered per request instead of being fixed by one reward. It still needs
attribute labels (often from an attribute prediction model), and it isn't quantization or tokenization.
"""

[[questions]]
id = "04-29"
topic = "Warm-up"
question = """
Full fine-tuning of a 13B model diverges (loss spikes to NaN) in the first 50 steps at learning
rate 2e-5 with no warm-up. What is the most appropriate first change?
"""
options = [
  "Add a learning-rate warm-up (for example linear over the first few hundred steps) before the cosine decay",
  "Increase the learning rate to 2e-4",
  "Remove gradient clipping",
  "Train for more epochs",
]
answer = ["A"]
explanation = """
Early in training, Adam's moment estimates are unreliable and the first updates can be large.
Ramping the learning rate up over a few hundred steps is the standard stabiliser, often combined
with gradient clipping. A 10× higher rate makes divergence worse, removing clipping removes a
safety net, and more epochs don't fix instability in the first steps.
"""

[[questions]]
id = "04-30"
topic = "Overfitting"
question = """
During SFT, training loss keeps falling, but validation loss starts rising after epoch 2 and the
model repeats training answers verbatim. What should you do?
"""
options = [
  "Train for more epochs until validation loss falls again",
  "Remove the validation set",
  "Increase the LoRA rank",
  "Stop at the best validation checkpoint (early stopping) and consider more diverse data or regularisation (dropout, fewer epochs)",
]
answer = ["D"]
explanation = """
Rising validation loss with falling training loss is overfitting, and the verbatim answers show
memorisation. Keep the checkpoint with the best validation score and reduce the pressure to memorise.
More epochs or more rank increase overfitting, and without a validation set you can't see it at all.
"""

[[questions]]
id = "04-31"
topic = "LoRA scaling"
question = "In LoRA, the update is scaled by α / r. Why?"
options = [
  "To make the update larger for larger ranks",
  "To keep the effective magnitude of the update roughly stable when r changes, so learning-rate settings transfer between ranks",
  "To normalise the adapter weights to unit length",
  "To make the adapter output zero at initialisation",
]
answer = ["B"]
explanation = """
Larger r means more terms in B·A, which tends to increase the update's size. Dividing by r
compensates, and α sets the overall strength (α = r or 2r are common). Zero output at
initialisation comes from B = 0, not from the scaling, and the adapter weights are not unit-normalised.
"""

[[questions]]
id = "04-32"
topic = "Knowledge vs behaviour"
question = """
A company wants its assistant to know product prices that change daily. An engineer proposes
daily LoRA fine-tuning on the new price list. What is the better approach, and why?
"""
options = [
  "Daily full fine-tuning, because LoRA can't learn prices",
  "Increase the LoRA rank so it memorises prices better",
  "Keep prices out of the weights: retrieve them at query time (RAG or a tool/API call), because fine-tuning is slow to update, unreliable for exact facts, and can cause forgetting",
  "Put all prices in the system prompt of a model fine-tuned once",
]
answer = ["C"]
explanation = """
Fine-tuning is good at behaviour and style but unreliable for precise, fast-changing facts. It
needs a training run per change and risks hallucinated or outdated numbers. Retrieval or tool use
fetches the current value with a source. A bigger rank doesn't make memorisation reliable, and a
long price list in every prompt is costly and still becomes stale.
"""

[[questions]]
id = "04-33"
topic = "NeMo Customizer"
question = "What is NVIDIA NeMo Customizer?"
options = [
  "A tokenizer training tool",
  "A GPU driver extension",
  "A vector database for RAG",
  "A microservice that exposes an API for running fine-tuning jobs (for example LoRA or full SFT) on supported models, as part of NeMo microservices",
]
answer = ["D"]
explanation = """
NeMo Customizer packages model customization as a service: you submit a dataset and a
configuration, and it runs the fine-tuning job, producing adapters or checkpoints to serve with NIM.
It isn't a tokenizer tool, a driver or a database (NeMo Retriever and partner vector databases fill that role).
"""

[[questions]]
id = "04-34"
topic = "Alignment pipeline"
question = "In the usual LLM alignment pipeline, in what order are these stages applied?"
options = [
  "Pre-training, then supervised fine-tuning (instruction tuning), then preference alignment (RLHF or DPO)",
  "Preference alignment, then pre-training, then SFT",
  "SFT, then pre-training, then DPO",
  "DPO only; the other stages are optional",
]
answer = ["A"]
explanation = """
Pre-training builds general knowledge from raw text. SFT teaches the model to follow instructions
in the target format. Preference alignment then refines which of the model's possible answers humans
prefer, and DPO or PPO both start from the SFT model as the reference. Preference methods need a
capable instruction-following model to start from.
"""

[[questions]]
id = "04-35"
topic = "Instruction tuning"
question = "What does instruction tuning (supervised fine-tuning on instruction–response pairs) mainly give a pre-trained base model?"
options = [
  "Large amounts of new factual knowledge",
  "The ability to follow natural-language instructions in a conversational format, which also makes zero-shot prompting work",
  "A smaller parameter count",
  "Immunity to prompt injection",
]
answer = ["B"]
explanation = """
A base model only continues text. Instruction tuning on many tasks phrased as instructions teaches
it to treat the prompt as a request and answer it, which is why instruct models do well zero-shot.
Knowledge mostly comes from pre-training, parameters are unchanged, and instruction-tuned models
remain vulnerable to injection (guardrails, Lab 10).
"""
