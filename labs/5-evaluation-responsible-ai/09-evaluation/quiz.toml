domain = "Evaluation"
code = "09"
weight = 7

[[questions]]
id = "09-01"
topic = "Scalable evaluation pipeline"
question = """
A research group wants to compare multiple large language models using a scalable evaluation
pipeline that integrates NVIDIA Triton for inference and Weights & Biases for experiment tracking.
The team must design a system that can support quantitative benchmarking, qualitative review, and
continuous error analysis. Which design choices are MOST aligned with best practices for scalable,
trustworthy LLM assessment? (Select TWO.)
"""
options = [
  "Serve all candidate models behind Triton with identical, versioned prompts, decoding parameters and held-out datasets, and log every run's config, metrics and sample outputs to W&B for side-by-side comparison",
  "Combine automatic metrics with structured qualitative review (rubric-based LLM-as-judge calibrated against human ratings), and log per-example results so failures can be sliced and categorised over time",
  "Evaluate each model on whichever prompt format gives it the highest score, since models differ",
  "Use only training loss curves from W&B to rank the models",
  "Run evaluation manually in notebooks and paste the final numbers into a spreadsheet",
]
answer = ["A", "B"]
explanation = """
Trustworthy comparisons need controlled conditions: the same data, prompts and decoding
settings, reproducible and tracked runs, and scalable batched inference through Triton. Qualitative
review at scale (a calibrated judge plus human spot checks) and per-example logging enable
continuous error analysis. Tuning prompts per model biases the comparison. Training loss doesn't
measure downstream quality. Manual notebooks aren't scalable or reproducible.
"""

[[questions]]
id = "09-02"
topic = "Choosing metrics"
question = "Which pairing of task and primary automatic metric is most appropriate?"
options = [
  "Abstractive summarisation: ROUGE-L, supplemented by a faithfulness check",
  "Machine translation: perplexity of the reference translation",
  "Code generation: BLEU against a reference solution",
  "Multi-class intent classification: ROUGE-1",
]
answer = ["A"]
explanation = """
ROUGE's recall-oriented overlap is the standard summarisation metric, but it misses
hallucinations, so a faithfulness or groundedness check is added. Translation uses BLEU or
chrF/COMET. Code is judged by execution (pass@k), because many correct programs differ
textually. Classification uses accuracy or F1.
"""

[[questions]]
id = "09-03"
topic = "Statistical significance"
question = """
Model B scores 71.4% versus Model A's 70.9% on a 400-question internal benchmark. Before
announcing B as better, what should you do?
"""
options = [
  "Compute a paired bootstrap confidence interval (or a paired significance test) on per-question results; if the interval includes zero, the difference isn't reliable",
  "Nothing; a higher score is always better",
  "Re-run B with a higher temperature to see if it improves further",
  "Report only B's score",
]
answer = ["A"]
explanation = """
A 0.5-point difference on 400 items (about 2 questions) is well within sampling noise. Paired
resampling on the same items gives a confidence interval for the difference. Changing decoding
for one model biases the comparison. Report both scores with uncertainty.
"""

[[questions]]
id = "09-04"
topic = "LLM-as-judge bias"
question = "Which practices reduce known biases when using an LLM as a judge for pairwise comparisons? (Select TWO.)"
options = [
  "Evaluate each pair twice with the answer order swapped, and count only consistent verdicts",
  "Use a rubric with anchored criteria, and check the judge's agreement with human ratings (for example Cohen's κ) on a sample",
  "Always use the same model family as the judge and as the model being evaluated",
  "Prefer the longer answer when the judge is uncertain",
  "Hide the rubric from the judge to avoid overfitting",
]
answer = ["A", "B"]
explanation = """
LLM judges show position bias (fixed by swapping order), verbosity bias and self-preference.
Clear rubrics and calibration against human judgements make scores meaningful. Using the same
family invites self-preference. Favouring length amplifies verbosity bias. A hidden rubric makes
scores inconsistent.
"""

[[questions]]
id = "09-05"
topic = "Perplexity"
question = "Why can't you compare perplexity directly between Llama-3 (128k vocabulary) and Llama-2 (32k vocabulary) on the same text?"
options = [
  "Perplexity is normalised per token, and the tokenizers split the same text into different numbers and kinds of tokens",
  "Perplexity is only defined for encoder models",
  "Perplexity needs labelled data",
  "Larger vocabularies always give lower perplexity",
]
answer = ["A"]
explanation = """
Perplexity is exp(average negative log-likelihood per token). Different tokenizers produce
different token counts and granularity, so per-token values aren't comparable. Use bits per byte
or per character, or compare task metrics instead. Perplexity is defined for autoregressive LMs
and needs no labels.
"""

[[questions]]
id = "09-06"
topic = "RAG evaluation"
question = """
A RAG assistant gives wrong answers on 20% of test questions. How should you evaluate it to find
the failing component?
"""
options = [
  "Measure retrieval separately (recall@k / MRR against gold passages) and generation separately (faithfulness to the retrieved context, answer correctness), then categorise each failure",
  "Measure only final answer accuracy",
  "Measure only embedding-model perplexity",
  "Increase top-k until accuracy improves",
]
answer = ["A"]
explanation = """
Component-level metrics show whether the right passage was never retrieved (a retrieval or
chunking problem) or was retrieved but ignored or contradicted (a generation or prompting
problem). End-to-end accuracy alone can't tell them apart. Blindly raising top-k can hurt
precision and add noise to the context.
"""

[[questions]]
id = "09-07"
topic = "pass@k"
question = """
You sample n=20 solutions per HumanEval problem at temperature 0.8, and 3 pass the unit tests for
a given problem. What is the unbiased estimate of pass@1 for that problem?
"""
options = ["0.15", "0.30", "1.0", "0.05"]
answer = ["A"]
explanation = """
pass@k = 1 − C(n−c, k)/C(n, k). For k=1 this is c/n = 3/20 = 0.15. Averaging over problems gives
the benchmark score. For larger k the combinatorial form avoids the high variance of estimating
from exactly k samples.
"""

[[questions]]
id = "09-08"
topic = "Error analysis"
question = """
Overall accuracy of a support classifier is 92%, but complaints come mostly from non-English
users. What is the most useful next step?
"""
options = [
  "Slice the evaluation by language (and other attributes), compare per-slice accuracy and confusion matrices, and examine sampled errors from the worst slices",
  "Report the 92% since it exceeds the target",
  "Retrain on the same data with more epochs",
  "Remove non-English examples from the test set",
]
answer = ["A"]
explanation = """
Aggregate metrics hide weak subgroups. Slicing exposes where the model fails, and qualitative
review of errors shows why (tokenisation, missing training data, label noise), which guides a fix
such as targeted data collection. Removing the hard cases hides the problem.
"""

[[questions]]
id = "09-09"
topic = "Inter-rater agreement"
question = """
Two annotators label 1,000 outputs as safe or unsafe and agree 94% of the time, but 95% of outputs
are safe. What should you report to judge annotation reliability?
"""
options = [
  "Cohen's κ, which corrects agreement for chance; high raw agreement can coincide with low κ when one class dominates",
  "Only the 94% raw agreement",
  "Macro-F1 of annotator A",
  "Perplexity of the annotations",
]
answer = ["A"]
explanation = """
With 95% of outputs safe, two raters who label almost everything "safe" agree about 90% of the
time by chance. κ = (p_o − p_e)/(1 − p_e) measures agreement beyond chance, and it can be low here
even with 94% raw agreement. This shows whether the rare "unsafe" labels are reliable.
"""

[[questions]]
id = "09-10"
topic = "Benchmark selection"
question = "Which benchmark primarily measures multi-step grade-school mathematical reasoning?"
options = ["GSM8K", "HellaSwag", "TruthfulQA", "HumanEval"]
answer = ["A"]
explanation = """
GSM8K has about 8.5k grade-school word problems that need multi-step arithmetic reasoning, and
it is often used to test chain-of-thought. HellaSwag tests commonsense sentence completion,
TruthfulQA tests resistance to common misconceptions, and HumanEval tests Python code generation.
"""

[[questions]]
id = "09-11"
topic = "Continuous evaluation"
question = """
Prompt templates and model versions change weekly. How do you catch quality regressions before
they reach users?
"""
options = [
  "Maintain a versioned regression suite (golden set, adversarial and safety cases) that runs automatically in CI on every model or prompt change, with pass/fail thresholds that gate deployment",
  "Rely on user complaints",
  "Evaluate once at initial launch",
  "Test only the model weights, not the prompts",
]
answer = ["A"]
explanation = """
Treat evaluation like software tests. Automated suites run on every change and block releases
that fall below thresholds. Prompts and templates change behaviour as much as weights do, so they
belong in the suite. Waiting for complaints means users find the regressions.
"""

[[questions]]
id = "09-12"
topic = "Retrieval metrics"
question = """
A reranker's goal is to put the single most relevant passage at the top. Which metric reflects
this directly?
"""
options = [
  "Mean reciprocal rank (MRR), or nDCG@k with graded relevance",
  "Recall@100",
  "BLEU",
  "Perplexity",
]
answer = ["A"]
explanation = """
MRR rewards placing the first relevant item near rank 1, and nDCG weighs graded relevance by
position. Both are position-sensitive, which is what reranking changes. Recall@100 barely moves
when items are reordered within the top 100. BLEU and perplexity aren't ranking metrics.
"""

[[questions]]
id = "09-13"
topic = "LLM-as-judge bias"
question = """
A pairwise LLM judge picks the answer shown first 70% of the time, whichever model produced it.
What is the standard mitigation?
"""
options = [
  "Use a larger temperature for the judge",
  "Judge each pair twice with the answer order swapped, and count only verdicts that stay consistent (treat inconsistent ones as ties)",
  "Always show the new model's answer first",
  "Replace pairwise comparison with BLEU",
]
answer = ["B"]
explanation = """
This is position bias. Swapping the order and requiring agreement removes verdicts driven by the
slot rather than the content. More randomness doesn't remove the bias, fixing the order bakes it
in, and BLEU doesn't measure open-ended quality.
"""

[[questions]]
id = "09-14"
topic = "Faithfulness"
question = "In RAG evaluation, what does faithfulness (groundedness) measure?"
options = [
  "Whether the retriever found all relevant documents",
  "How fluent the answer is",
  "The fraction of the answer's claims that are supported by the retrieved context",
  "How fast the answer was generated",
]
answer = ["C"]
explanation = """
Faithfulness checks the generation step: claims not supported by the provided context are
hallucinations, even if fluent. Retrieval completeness is recall@k, fluency is a separate quality
dimension, and speed is latency.
"""

[[questions]]
id = "09-15"
topic = "Benchmark scoring"
question = """
In lm-evaluation-harness, a multiple-choice task reports both acc and acc_norm. What is the difference?
"""
options = [
  "acc uses the total log-likelihood of each option; acc_norm normalises it by the option's length so longer options aren't penalised just for having more tokens",
  "acc_norm is accuracy after removing hard questions",
  "acc is for base models and acc_norm is for chat models",
  "acc_norm averages over several random seeds",
]
answer = ["A"]
explanation = """
The harness scores each option's text by log-likelihood and picks the highest. Longer options sum
more negative log-probabilities, so acc_norm divides by length (characters or tokens depending on
the task). It removes no questions, applies to any model, and isn't a seed average.
"""

[[questions]]
id = "09-16"
topic = "Evaluation reproducibility"
question = """
Two teams report different MMLU scores for the same model (65.2 vs 69.8). Which differences most
likely explain this? (Select TWO.)
"""
options = [
  "Different prompt formats or numbers of few-shot examples",
  "Different scoring methods (log-likelihood of options vs generating and parsing a letter, acc vs acc_norm)",
  "The GPU brand used for evaluation",
  "The time of day the evaluation ran",
  "The size of the evaluation server's disk",
]
answer = ["A", "B"]
explanation = """
Benchmark scores are sensitive to the prompt template, few-shot count, and how answers are
extracted or scored. Reports must fix and state these to be comparable. Hardware, time of day and
disk size don't change the model's predictions, apart from negligible numerical differences.
"""

[[questions]]
id = "09-17"
topic = "Regression testing"
question = """
A new prompt template improves the average helpfulness score but slightly lowers the safety pass
rate on the red-team suite. Under a zero-tolerance gate for safety metrics, what happens?
"""
options = [
  "It ships, because the average score went up",
  "It ships to 50% of users",
  "The release is blocked until the safety regression is fixed; improvements on one metric don't offset a gated regression on another",
  "The safety suite is removed",
]
answer = ["C"]
explanation = """
Regression gates check each tracked metric against its own tolerance. Safety metrics usually allow
no drop at all, so any regression fails the gate. Averaging would let a safety loss hide behind a
helpfulness gain. Partial rollouts and deleting tests defeat the gate.
"""

[[questions]]
id = "09-18"
topic = "Human evaluation"
question = "When is human evaluation still necessary even though automatic metrics and LLM judges exist?"
options = [
  "Never; LLM judges have replaced humans",
  "Only for measuring latency",
  "Only for code generation",
  "To calibrate and validate automatic judges (agreement checks), for high-stakes or subjective quality decisions, and to create preference data",
]
answer = ["D"]
explanation = """
LLM judges are only trustworthy after their agreement with humans has been checked (Cohen's κ on
a sample). Final decisions on subjective or high-stakes quality, and preference datasets for RLHF
or DPO, still rely on people. Latency is measured automatically, and code is judged by tests.
"""

[[questions]]
id = "09-19"
topic = "Retrieval metrics"
question = """
You add a cross-encoder reranker that reorders the top-20 retrieved passages. Which metric will
NOT change, by construction?
"""
options = [
  "MRR",
  "Precision@1",
  "Recall@20 (over the same 20 candidates)",
  "nDCG@5",
]
answer = ["C"]
explanation = """
Reranking changes the order of the same 20 passages, so the set of relevant items among the 20, and
therefore recall@20, is fixed. Position-sensitive metrics (MRR, P@1, nDCG@5) are exactly what
reranking should improve.
"""

[[questions]]
id = "09-20"
topic = "Calibration of evaluation"
question = """
Model A beats Model B on 3 of 5 benchmarks, each with a few hundred items and differences under one
point. What is the most defensible conclusion?
"""
options = [
  "Model A is better overall",
  "Model B is better overall",
  "The results are inconclusive until uncertainty is quantified (confidence intervals or paired tests per benchmark); differences under a point on a few hundred items are often within noise",
  "The benchmarks are broken",
]
answer = ["C"]
explanation = """
With a few hundred items, sampling noise is often larger than a point, so counting wins over tiny
differences isn't evidence. Report intervals and test significance. Nothing suggests the
benchmarks are broken.
"""

[[questions]]
id = "09-21"
topic = "Perplexity"
question = "A team lowers validation perplexity on legal text from 12 to 8 through domain-adaptive pre-training. What can they conclude?"
options = [
  "The model predicts legal text better, but task performance (for example contract Q&A accuracy) must be measured separately",
  "Contract Q&A accuracy improved by 33%",
  "The model has fewer hallucinations",
  "The model will perform better on all benchmarks",
]
answer = ["A"]
explanation = """
Lower perplexity means better next-token prediction on that domain, which is a good sign for
domain adaptation. It doesn't translate directly into accuracy on downstream tasks, factuality or
general benchmarks, and general skills can even degrade (forgetting). Evaluate the target tasks.
"""

[[questions]]
id = "09-22"
topic = "Evaluation data"
question = "Which practices keep an evaluation set trustworthy over time? (Select TWO.)"
options = [
  "Keep a held-out test set that is never used for tuning prompts or hyperparameters",
  "Deduplicate and decontaminate against training data, and refresh or extend it as production traffic changes",
  "Add the test set to the fine-tuning data to improve scores",
  "Tune the prompt until the test score stops improving",
  "Delete failing examples from the test set",
]
answer = ["A", "B"]
explanation = """
Tuning on the test set turns it into training data, so scores stop measuring generalisation. It
must stay separate, clean of overlap with training data, and representative of current usage.
Training on it, tuning to it, or deleting hard cases all inflate scores without improving the model.
"""

[[questions]]
id = "09-23"
topic = "Judge rubric"
question = "Which design makes LLM-as-judge scores most consistent and meaningful?"
options = [
  "Ask the judge 'Is this good?' with no further guidance",
  "A clear rubric with defined criteria and anchored score levels (examples of what each score means), asking for reasoning before the score",
  "Letting the judge choose its own scale for each answer",
  "Using the highest temperature available",
]
answer = ["B"]
explanation = """
Anchored rubrics make the judge apply the same standard to every item, and reasoning before the
score improves reliability. Vague prompts, changing scales and high temperature all increase
inconsistency.
"""

[[questions]]
id = "09-24"
topic = "Code evaluation"
question = "Why is BLEU a poor primary metric for code generation, and what is used instead?"
options = [
  "BLEU is too slow; use ROUGE instead",
  "BLEU only works for English; use perplexity instead",
  "BLEU rewards long programs; use program length instead",
  "Many correct programs differ textually from the reference, and small textual differences can break code; execution-based metrics such as pass@k with unit tests are used instead",
]
answer = ["D"]
explanation = """
Code correctness is functional. Two different implementations can both pass, and a one-character
change can break a program that scores high on n-gram overlap. HumanEval and MBPP run unit tests
and report pass@k. ROUGE, perplexity and length don't measure functional correctness.
"""
