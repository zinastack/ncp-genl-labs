# Same structure your k8s_deployment() exercise builds. Build and push the image first:
#   docker build -t <registry>/triton-textclf:24.12 triton/ && docker push <registry>/triton-textclf:24.12
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  labels: {app: triton}
spec:
  replicas: 1
  selector:
    matchLabels: {app: triton}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never drop capacity during a rollout
  template:
    metadata:
      labels: {app: triton}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: triton
          image: genl-labs/triton-textclf:24.12
          args: ["tritonserver", "--model-repository=/models", "--strict-readiness=true"]
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 8001, name: grpc}
            - {containerPort: 8002, name: metrics}
          resources:
            limits: {nvidia.com/gpu: 1}
          startupProbe:            # model load can take minutes: don't let liveness kill it
            httpGet: {path: /v2/health/ready, port: 8000}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}   # Python backend uses shared memory
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  selector: {app: triton}
  ports:
    - {name: http, port: 8000}
    - {name: grpc, port: 8001}
    - {name: metrics, port: 8002}
