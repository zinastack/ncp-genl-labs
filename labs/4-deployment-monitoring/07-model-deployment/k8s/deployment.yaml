# Triton on Kubernetes: the same image as Docker Compose (built on this machine, k3s uses the host's
# Docker, so no registry push is needed). `make k8s-deploy` substitutes __TAG__ with TRITON_VERSION.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  labels: {app: triton}
spec:
  replicas: 1
  selector:
    matchLabels: {app: triton, version: v1}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never drop capacity... if a spare GPU exists (task K5)
  template:
    metadata:
      labels: {app: triton, version: v1}
      annotations:
        prometheus.io/scrape: "true"     # the in-cluster Prometheus scrapes pods with this annotation
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: triton
          image: genl-labs/triton-textclf:__TAG__
          imagePullPolicy: IfNotPresent
          args: ["tritonserver", "--model-repository=/models", "--model-control-mode=explicit",
                 "--load-model=text_classifier", "--strict-readiness=true",
                 "--metrics-config=summary_latencies=true"]
          env:
            - {name: SLOW_LOAD_SECONDS, value: "0"}    # task K2 raises this to simulate a big model
          ports:
            - {containerPort: 8000, name: http}
            - {containerPort: 8001, name: grpc}
            - {containerPort: 8002, name: metrics}
          resources:
            requests: {cpu: "1", memory: 3Gi}
            limits: {nvidia.com/gpu: 1, memory: 6Gi}   # the device plugin makes nvidia.com/gpu schedulable
          startupProbe:            # model load can take minutes: liveness only starts after this succeeds
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 60   # up to 10 minutes
          readinessProbe:          # gate traffic: only READY pods are Service endpoints
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:           # restart a hung server
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}   # the Python backend passes tensors through shared memory
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
# Selects app=triton only (not version), so the canary's v2 pods also receive traffic (task K6).
apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  type: NodePort
  selector: {app: triton}
  ports:
    - {name: http, port: 8000, nodePort: 30800}
    - {name: grpc, port: 8001, nodePort: 30801}
    - {name: metrics, port: 8002, nodePort: 30802}
