# Scale on queue time, not CPU. Needs Prometheus Adapter (or KEDA) exposing the metric
# per pod, e.g. rate(nv_inference_queue_duration_us[1m]) / rate(nv_inference_request_success[1m]).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: triton}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric: {name: triton_avg_queue_us}
        target: {type: AverageValue, averageValue: "5000"}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # GPU pods are slow to start: scale down cautiously
