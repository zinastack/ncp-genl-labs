# Task K4: scale on queue time, not CPU. CPU stays low while requests queue for the GPU.
# prometheus-adapter (adapter-values.yaml) turns Triton's counters into the per-pod metric
# triton_avg_queue_us = rate(queue time) / rate(successful requests).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: triton
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: triton}
  minReplicas: 1
  maxReplicas: 4             # ≤ schedulable nvidia.com/gpu (time-slicing replicas in this lab)
  metrics:
    - type: Pods
      pods:
        metric: {name: triton_avg_queue_us}
        target: {type: AverageValue, averageValue: "5000"}   # 5 ms average queue time per pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 120   # lab value; production GPU pods use 300+ (slow, costly to restart)
