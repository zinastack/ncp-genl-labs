topic = "TensorRT-LLM"
question = """
A model is served with TensorRT-LLM using the TensorRT engine backend. Which changes require
rebuilding the engine? (Select TWO)
"""
options = [
  "Raising max_batch_size from 64 to 256",
  "Switching the weights to INT8 weight-only quantization",
  "Changing kv_cache_free_gpu_memory_fraction from 0.5 to 0.9",
  "Changing the sampling temperature for a request",
  "Changing the number of streaming clients",
]
answer = ["A", "B"]
explanation = """
Build-time limits such as max_batch_size, max_num_tokens and max_seq_len, and the quantization of the
weights, are compiled into a TensorRT engine, so changing them means rebuilding. The KV-cache memory
fraction is a runtime setting of the executor; sampling parameters are per request; the number of
clients is just traffic.
"""

[[questions]]
id = "07-35"
topic = "TensorRT-LLM"
question = """
A TensorRT-LLM chat endpoint on one 24 GB GPU shows rising time-to-first-token at peak while
time-per-output-token stays flat. Logs show the KV cache holds only about 40 sequences of the
typical length, and max_batch_size is 256. What most directly raises the number of requests served
concurrently?
"""
options = [
  "Give the KV cache more memory: raise kv_cache_free_gpu_memory_fraction and/or quantize weights or the KV cache (INT8/FP8) to free memory",
  "Raise max_batch_size to 1024",
  "Lower the maximum output tokens per response to 16 for every user",
  "Switch from in-flight batching to static batching",
]
answer = ["A"]
explanation = """
The scheduler can only admit as many sequences as the KV cache can hold, so with room for about 40
sequences a max_batch_size of 256 is never reached; extra requests wait, which raises TTFT. More cache
memory (a larger fraction, smaller weights, or an FP8/INT8 KV cache) raises real concurrency. A larger
max_batch_size changes nothing while the cache is full, truncating every answer breaks the product,
and static batching makes waiting worse.
"""

[[questions]]
id = "07-36"
topic = "TensorRT-LLM"
question = """
After switching a 1.5B-parameter LLM from FP16 to INT8 weight-only quantization (W8A16), decode speed
(tokens per second per request) improves even though the matrix math still runs in FP16. Why?
"""
options = [
  "Decoding is memory-bandwidth-bound: reading half as many bytes of weights per token makes each decode step faster",
  "INT8 tensor cores are always used for weight-only quantization",
  "Weight-only quantization reduces the number of transformer layers",
  "The KV cache is no longer used with INT8 weights",
]
answer = ["A"]
explanation = """
At small batch sizes each decode step reads all the weights from memory to produce one token per
sequence, so memory bandwidth dominates. Storing weights in INT8 halves those bytes; they are
dequantized on the fly and multiplied in FP16. The layer count is unchanged, the KV cache is still
used, and weight-only kernels do not run INT8 math on activations.
"""

[[questions]]
id = "07-37"
topic = "NIM"
question = """
A NIM container auto-selects a vLLM profile on one cluster and a TensorRT-LLM throughput profile on
another, so benchmarks are not reproducible across environments. How do you make every deployment
run the same engine configuration?
"""
options = [
  "List the profiles with list-model-profiles and set NIM_MODEL_PROFILE to the chosen profile id, with a pinned image version",
  "Set the OpenAI request parameter model to the profile name",
  "Delete the NIM cache before each start so selection is repeated",
  "Run the container without GPUs so it always picks the same CPU profile",
]
answer = ["A"]
explanation = """
NIM picks a profile (backend, precision, tensor parallelism, latency or throughput) that matches the
detected GPUs unless NIM_MODEL_PROFILE pins one; pinning the image version as well keeps the set of
profiles fixed. The model field of a request does not choose engines, clearing the cache repeats the
same automatic choice, and LLM NIMs are not meant to run without GPUs.
"""

[[questions]]
id = "07-38"
topic = "GPU sharing"
question = """
Four small inference services each need about 15% of one GPU. A platform engineer enables device
plugin time-slicing with replicas: 4 on a single-GPU node. Which statement is correct?
"""
options = [
  "All four pods are scheduled and share the GPU in turns, but without memory or fault isolation: one pod can exhaust GPU memory for all",
  "Each pod gets a hard 25% slice of GPU memory and compute",
  "Time-slicing is the same as MIG and works on any GPU",
  "Pods can now request nvidia.com/gpu: 0.25",
]
answer = ["A"]
explanation = """
Time-slicing makes the device plugin advertise several replicas of a GPU so more pods can be
scheduled, and they take turns on it. There is no memory limit or fault isolation between them.
MIG (A100, H100 and newer) provides hardware-isolated instances with fixed memory. GPU requests stay
integers; time-slicing changes how many units the node advertises.
"""

[[questions]]
id = "07-39"
topic = "Kubernetes GPU scheduling"
question = """
A cluster has L4 and A100 nodes. GPU feature discovery is installed. An inference Deployment must run
only on L4 nodes. What is the standard way?
"""
options = [
  "Add a nodeSelector (or node affinity) on the GPU product label, e.g. nvidia.com/gpu.product: NVIDIA-L4",
  "Request nvidia.com/gpu: 4 so only L4 nodes match",
  "Set the container image tag to l4",
  "Add a readiness probe that fails on A100 nodes",
]
answer = ["A"]
explanation = """
GPU feature discovery labels nodes with the GPU model, memory and capabilities, and scheduling
constraints (nodeSelector or affinity) use those labels. The GPU count says nothing about the GPU
type, image tags do not influence scheduling, and a failing readiness probe leaves the pod running on
the wrong node without traffic instead of placing it correctly.
"""

[[questions]]
id = "07-40"
topic = "Health probes"
question = """
An operator unloads a model through Triton's repository API during maintenance. What do the health
endpoints report, and what does Kubernetes do with a pod using the usual probes (liveness on
/v2/health/live, readiness on /v2/health/ready with --strict-readiness=true)?
"""
options = [
  "live stays true and ready becomes false: the pod is removed from Service endpoints but not restarted",
  "live becomes false: the kubelet restarts the container",
  "Both stay true, so traffic keeps arriving and fails",
  "ready stays true until the pod is deleted",
]
answer = ["A"]
explanation = """
The server process is still healthy, so liveness passes and nothing restarts. With strict readiness,
a model that is not loaded makes readiness fail, so the pod stops receiving traffic until the model
is loaded again. This is exactly why readiness and liveness are separate probes.
"""

[[questions]]
id = "07-41"
topic = "LLM serving memory"
question = """
A 3 GB model is served on a 24 GB GPU twice: once with vLLM --gpu-memory-utilization 0.5, once with
TensorRT-LLM kv_cache_free_gpu_memory_fraction 0.5. Which server gets the larger KV cache, and why?
"""
options = [
  "TensorRT-LLM: its fraction applies to the memory left after loading the weights, while vLLM's caps the total memory used for weights, activations and cache",
  "vLLM: its fraction applies only to the KV cache, while TensorRT-LLM's includes the weights",
  "They are identical, because both parameters mean the share of GPU memory given to the KV cache",
  "Neither: both servers ignore the fraction when the model is smaller than 8 GB",
]
answer = ["A"]
explanation = """
vLLM's gpu_memory_utilization is the share of total GPU memory the whole executor may use, so the cache is
roughly 0.5 × 24 minus the weights and activation memory (about 8 GB here). TensorRT-LLM's
free_gpu_memory_fraction is applied to the memory still free after weights and buffers, about
0.5 × 20 = 10 GB here. The same number therefore yields different caches, which matters when you port
settings between servers.
"""

[[questions]]
id = "07-42"
topic = "Chunked prefill"
question = """
Users of an LLM chat service report that whenever someone submits a very long document, every other
user's stream stalls for a moment. Decode speed is otherwise fine. Which change addresses this directly?
"""
options = [
  "Enable chunked prefill and keep the per-iteration token budget (max_num_tokens / max_num_batched_tokens) moderate, so long prompts are prefilled in pieces between decode steps",
  "Raise max_model_len so long documents are accepted",
  "Increase temperature so generation finishes sooner",
  "Disable the paged KV cache",
]
answer = ["A"]
explanation = """
Without chunking, a long prompt is prefilled in one large iteration, and every running sequence waits
for it before its next token. Chunked prefill splits the prompt over several iterations that also carry
the decode tokens, smoothing inter-token latency. A larger max_model_len only admits longer prompts,
sampling settings do not change compute, and paging is what makes efficient batching possible.
"""

[[questions]]
id = "07-43"
topic = "LLM serving limits"
question = """
A vLLM server runs with --max-model-len 4096. A client sends a 3,900-token prompt with max_tokens 512
and gets a 400 error. What is the correct fix if answers of up to 512 tokens are required?
"""
options = [
  "Restart the server with max_model_len of at least 4,412 (prompt plus answer), if the model's context and the KV cache allow it",
  "Lower the temperature to 0",
  "Raise max_num_seqs",
  "Set gpu_memory_utilization to 1.0",
]
answer = ["A"]
explanation = """
max_model_len bounds prompt tokens plus generated tokens for one sequence, so 3,900 + 512 exceeds 4,096
and the request is rejected up front. Size it for the longest prompt plus the longest answer, within the
model's max_position_embeddings. Sampling, the number of sequences and the memory fraction do not change
the per-sequence length limit.
"""

[[questions]]
id = "07-44"
topic = "KV cache sizing"
question = """
Two models have the same number of layers and the same hidden size. Model A uses multi-head attention
with 32 KV heads; model B uses grouped-query attention with 8 KV heads. Both use head_dim 128. How does
this affect serving on the same GPU?
"""
options = [
  "Model B needs 4× less KV-cache memory per token, so about 4× more tokens fit in the same cache and more sequences can run concurrently",
  "Model B needs 4× more KV-cache memory because each KV head serves more query heads",
  "There is no difference: KV-cache size depends only on the number of layers",
  "Model B cannot use a paged KV cache",
]
answer = ["A"]
explanation = """
KV bytes per token = 2 × layers × KV heads × head_dim × bytes. Going from 32 to 8 KV heads divides it by
four, so the same cache holds four times the tokens and long contexts or large batches become affordable.
The query heads that share each KV head do not add cache. GQA models are served with paged KV caches like
any other model.
"""

[[questions]]
id = "07-45"
topic = "Sampling defaults"
question = """
The same prompt with no sampling parameters returns different styles of answer from a vLLM server and from
a custom server that only applies OpenAI defaults (temperature 1.0, top_p 1.0). The model's
generation_config.json sets temperature 0.7, top_p 0.8, top_k 20. What explains it?
"""
options = [
  "vLLM applies the model's generation_config.json as default sampling parameters (--generation-config auto), while the custom server uses its own defaults",
  "vLLM always runs greedy decoding when no parameters are given",
  "The custom server uses a different tokenizer automatically",
  "generation_config.json is only used during training",
]
answer = ["A"]
explanation = """
Request parameters override defaults, but when a request is silent the server's default policy decides.
vLLM loads generation_config.json by default, so the model publisher's temperature, top_p and top_k
apply. A server that ignores the file samples at temperature 1.0 with no filtering. Setting the
parameters explicitly in every request, or temperature 0 for deterministic output, removes the
difference.
"""

[[questions]]
id = "07-46"
topic = "Serving LLMs with Triton"
question = """
In a Triton model repository for an LLM served by the vLLM or TensorRT-LLM backend, which settings are
correct? (Select TWO)
"""
options = [
  "Triton's own dynamic batching stays off (max_batch_size 0 for the TensorRT-LLM LLM-API backend): the engine performs in-flight batching itself",
  "The model is decoupled so that one request can return many responses, which token streaming requires",
  "max_queue_delay_microseconds should be set high so Triton forms large batches before the engine",
  "instance_group count should equal the expected number of concurrent users",
  "Streaming works only over the KServe v2 /infer endpoint, not generate_stream",
]
answer = ["A", "B"]
explanation = """
LLM engines schedule tokens every iteration, so Triton's request-level dynamic batcher would only add
delay; the engine's max_batch_size controls concurrency instead. Streaming sends many responses for one
request, which needs a decoupled model and the generate_stream endpoint (or gRPC streaming). One
instance serves many concurrent users through in-flight batching; more instances would duplicate the
weights on the GPU.
"""
