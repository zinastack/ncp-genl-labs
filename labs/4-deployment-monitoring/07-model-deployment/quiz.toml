[[questions]]
id = "07-01"
topic = "Triton dynamic batching"
question = """
You are deploying a text classification model on NVIDIA Triton Inference Server in a Docker
container. Your SLO is P95 ≤ 20 ms end-to-end. The model's compute time is ~12 ms per request when
run with batch size 8, and ~7 ms per request with batch size 1. Which Triton config.pbtxt dynamic
batching block is the best starting point to meet the SLO while still gaining throughput from
batching?
"""
options = [
  """
```
dynamic_batching {
  preferred_batch_size: [ 4, 8 ]
  max_queue_delay_microseconds: 2000
}
```
""",
  """
```
dynamic_batching {
  preferred_batch_size: [ 32 ]
  max_queue_delay_microseconds: 50000
}
```
""",
  """
```
dynamic_batching {
  max_queue_delay_microseconds: 20000
}
```
""",
  """
```
dynamic_batching { }
max_batch_size: 0
```
""",
]
answer = ["A"]
explanation = """
The latency budget is roughly queue delay + compute + network. With batches of up to 8 (~12 ms),
a 2 ms queue delay leaves headroom under 20 ms while still forming batches under load. A 50 ms or
20 ms delay alone uses up or exceeds the SLO, and batch 32 isn't characterised and would be
slower. max_batch_size 0 disables batching altogether. Confirm with perf_analyzer or Model
Analyzer at the expected concurrency.
"""

[[questions]]
id = "07-02"
topic = "RAG relevance"
question = """
A team ships an NVIDIA-AI-Blueprints RAG service. Users report that answers sometimes cite
irrelevant passages even though the corpus is correct. Telemetry shows high recall but low
precision in top-k retrieval. Which adjustment is most appropriate first to improve answer
relevance without re-ingesting the corpus?
"""
options = [
  "Add a cross-encoder reranking stage (for example a NeMo Retriever reranking NIM) over a larger candidate set and pass only the top-reranked passages to the LLM",
  "Re-chunk and re-embed the entire corpus with a different chunk size",
  "Increase top-k from 5 to 50 passages sent to the LLM",
  "Raise the LLM temperature to encourage it to ignore irrelevant context",
]
answer = ["A"]
explanation = """
High recall with low precision means the right passages are retrieved but ranked among noise. A
reranker scores each (query, passage) pair jointly and reorders candidates, which raises
precision in the final context. It is a query-time change, so nothing is re-ingested. Re-chunking
requires re-ingestion. Sending 50 passages lowers precision further. Temperature doesn't fix
retrieval.
"""

[[questions]]
id = "07-03"
topic = "Triton ports"
question = "Which Triton Inference Server endpoint should Prometheus scrape to collect inference and GPU metrics?"
options = [
  "HTTP port 8002 at /metrics",
  "HTTP port 8000 at /v2/models/<name>/infer",
  "gRPC port 8001",
  "Port 9090 on the Triton container",
]
answer = ["A"]
explanation = """
Triton serves HTTP/REST on 8000, gRPC on 8001, and Prometheus-format metrics on 8002/metrics.
Those metrics include nv_inference_request_success, nv_inference_queue_duration_us and
nv_gpu_utilization. 9090 is Prometheus's own default port.
"""

[[questions]]
id = "07-04"
topic = "Instance groups"
question = """
A small model on Triton uses only 30% of the GPU with one instance, even at high concurrency,
because execution alternates with host-side pre/post-processing. Which config change most
directly increases GPU utilisation?
"""
options = [
  "Increase instance_group count (for example to 2–3 on the same GPU) so several executions overlap",
  "Set max_batch_size to 0",
  "Remove dynamic_batching",
  "Change the model version policy to serve all versions",
]
answer = ["A"]
explanation = """
Multiple model instances let Triton run requests concurrently, overlapping one instance's
host-side work and transfers with another's GPU compute. Disabling batching lowers throughput.
The version policy controls which versions are served, not concurrency.
"""

[[questions]]
id = "07-05"
topic = "Kubernetes GPU scheduling"
question = "How should a Kubernetes pod request one GPU so the scheduler places it on a GPU node?"
options = [
  "Set resources.limits: {nvidia.com/gpu: 1} (exposed by the NVIDIA device plugin / GPU Operator)",
  "Set resources.limits: {cpu: 1000}",
  "Add the environment variable CUDA_VISIBLE_DEVICES=0",
  "Run the container with --privileged only",
]
answer = ["A"]
explanation = """
The NVIDIA device plugin, installed by the GPU Operator, advertises the extended resource
nvidia.com/gpu. Requesting it in limits makes the scheduler pick a node with a free GPU and has
the runtime mount it. Environment variables and privileged mode don't affect scheduling.
"""

[[questions]]
id = "07-06"
topic = "Autoscaling"
question = """
An HPA scales Triton pods on CPU utilisation, but during traffic spikes latency degrades while
CPU stays at 20%. What is the better scaling signal? (Select TWO.)
"""
options = [
  "Triton queue time per request (nv_inference_queue_duration_us / nv_inference_request_success) through Prometheus Adapter or KEDA",
  "Requests in flight per pod, or GPU utilisation from DCGM",
  "Pod memory usage on the host",
  "The number of model versions loaded",
  "Node disk I/O",
]
answer = ["A", "B"]
explanation = """
GPU inference saturates on the GPU and shows up as a growing queue. CPU stays low. Queue latency,
in-flight requests or GPU utilisation track real load, and custom-metric autoscaling (Prometheus
Adapter, KEDA) lets the HPA use them. Host memory, version count and disk I/O don't reflect
inference saturation.
"""

[[questions]]
id = "07-07"
topic = "NIM"
question = "Which statement best describes NVIDIA NIM for LLMs?"
options = [
  "Prebuilt, optimised inference microservice containers that expose an OpenAI-compatible API and choose an optimised engine (for example TensorRT-LLM) for the available GPU",
  "A training framework for pre-training LLMs",
  "A vector database for RAG",
  "A Kubernetes replacement for GPU clusters",
]
answer = ["A"]
explanation = """
NIM packages a model, runtime and optimised engines into a container with standard APIs such as
/v1/chat/completions. That makes deployment a docker run or Helm install. Training is NeMo's job.
Vector databases (Milvus and others) and Kubernetes are separate components that NIM integrates
with.
"""

[[questions]]
id = "07-08"
topic = "Startup probes"
question = """
LLM pods on Kubernetes are killed and restarted in a loop during deployment. Logs show the model
was still loading (4 minutes) when the container was restarted. What is the fix?
"""
options = [
  "Add a startupProbe with a long enough failureThreshold × periodSeconds (or a large initialDelaySeconds) so liveness checks start only after the model has loaded",
  "Remove the readiness probe",
  "Reduce the number of GPUs requested",
  "Use the latest image tag",
]
answer = ["A"]
explanation = """
The liveness probe kills a container that is still loading weights. A startup probe holds off
liveness and readiness checks until startup succeeds, which is the standard pattern for slow-loading
models. Without a readiness probe, traffic goes to pods that aren't ready. The GPU count and the
image tag don't affect load time.
"""

[[questions]]
id = "07-09"
topic = "Ensembles"
question = """
A pipeline does tokenisation (CPU), a TensorRT model (GPU) and post-processing (CPU). Each step is
currently a separate microservice, which adds network latency. Which Triton feature keeps the
pipeline inside one server?
"""
options = [
  "A Triton ensemble model (or Business Logic Scripting in the Python backend) that chains the steps and passes tensors in memory",
  "Sequence batching",
  "Model version policies",
  "Rate limiting",
]
answer = ["A"]
explanation = """
Ensembles define a DAG of models whose outputs feed other models' inputs inside Triton, with no
extra serialisation or network hops. BLS allows custom control flow. Sequence batching is for
stateful models, version policies choose served versions, and rate limiting controls execution
priority.
"""

[[questions]]
id = "07-10"
topic = "Capacity planning"
question = """
A service receives 120 requests/s with an average latency of 0.5 s. Each replica handles up to 16
concurrent requests efficiently. How many replicas are needed without headroom?
"""
options = ["4", "8", "2", "60"]
answer = ["A"]
explanation = """
Little's law: in-flight requests = arrival rate × latency = 120 × 0.5 = 60. 60 / 16 = 3.75, which
rounds up to 4 replicas. Production sizing adds headroom (for example 20–30%) for spikes and
failures.
"""

[[questions]]
id = "07-11"
topic = "Containers"
question = "Which practices are appropriate for containerised GPU inference in production? (Select TWO.)"
options = [
  "Pin exact image tags (for example nvcr.io/nvidia/tritonserver:24.12-py3) and build from NGC base images",
  "Run containers with the NVIDIA Container Toolkit (--gpus or the Kubernetes device plugin) instead of installing drivers inside the image",
  "Always use :latest so security patches are picked up automatically",
  "Install the NVIDIA kernel driver inside every container image",
  "Store model weights in the container's writable layer at runtime",
]
answer = ["A", "B"]
explanation = """
Pinned tags make deployments reproducible and allow controlled upgrades. NGC images are tested
with the CUDA stack. The host driver is exposed to containers by the NVIDIA Container Toolkit, so
images carry only user-space CUDA libraries. :latest makes rollbacks and audits unreliable.
Writable-layer weights are lost on restart. Use baked-in images, volumes or a model cache.
"""

[[questions]]
id = "07-12"
topic = "Triton protocol"
question = "Which HTTP request path does Triton use to run inference with the KServe v2 protocol?"
options = [
  "POST /v2/models/<model_name>/infer",
  "POST /v1/chat/completions",
  "GET /predict/<model_name>",
  "POST /api/generate",
]
answer = ["A"]
explanation = """
Triton implements the KServe v2 inference protocol (/v2/models/<name>[/versions/<v>]/infer, plus
/v2/health/ready and /v2/health/live). /v1/chat/completions is the OpenAI-style API used by NIM
(and by Triton's OpenAI-compatible frontend). The other paths belong to other servers.
"""

[[questions]]
id = "07-13"
topic = "Model Analyzer"
question = """
You need to find the Triton configuration (max batch size, instance count, queue delay) that
maximises throughput while keeping P99 latency under 50 ms. Which tool automates this search?
"""
options = [
  "Triton Model Analyzer, which sweeps model configurations with perf_analyzer and reports the best ones under your constraints",
  "Nsight Compute",
  "NCCL tests",
  "TensorBoard",
]
answer = ["A"]
explanation = """
Model Analyzer generates candidate configurations, measures them with perf_analyzer, and ranks
them against objectives and constraints such as a latency budget or GPU memory. Nsight Compute
profiles kernels, NCCL tests benchmark collectives, and TensorBoard visualises training.
"""

[[questions]]
id = "07-14"
topic = "Rolling updates"
question = """
You roll out a new model version on a Kubernetes Deployment with 3 GPU replicas and must never
drop below 3 ready replicas. Which rollout settings achieve this?
"""
options = [
  "strategy RollingUpdate with maxUnavailable: 0 and maxSurge: 1, plus a readiness probe that passes only when the model is loaded",
  "strategy Recreate",
  "maxUnavailable: 100%",
  "Delete the Deployment and apply the new one",
]
answer = ["A"]
explanation = """
maxUnavailable 0 means an old pod is removed only after a new one is ready. maxSurge 1 allows one
extra pod, which needs one spare GPU, during the rollout. Readiness gating makes sure "ready"
means the model can serve. Recreate and deleting the Deployment cause downtime.
"""

[[questions]]
id = "07-15"
topic = "Ensembles"
question = "In a Triton ensemble's input_map and output_map entries, what do the key and the value refer to?"
options = [
  "The key is the step model's own tensor name; the value is the ensemble-internal tensor name that connects steps",
  "The key is the model version; the value is the model name",
  "The key is the client's HTTP header; the value is the tensor name",
  "Both refer to GPU device ids",
]
answer = ["A"]
explanation = """
Each step maps its model's input and output names to ensemble-level tensor names. When one step's
output_map value equals another step's input_map value, Triton passes that tensor between them in
memory. Versions are set by model_version, and neither HTTP headers nor device ids appear in these maps.
"""

[[questions]]
id = "07-16"
topic = "Model Analyzer"
question = """
Model Analyzer reports a configuration with 1,100 requests/s but P95 = 31 ms, and another with
780 requests/s and P95 = 19 ms. The SLO is P95 ≤ 20 ms. Which should you deploy, and how do you get more throughput?
"""
options = [
  "The 1,100 requests/s configuration, because throughput matters most",
  "Neither; switch to CPU inference",
  "The 780 requests/s configuration, and add replicas to reach the required total throughput",
  "The 1,100 requests/s configuration with a longer queue delay",
]
answer = ["C"]
explanation = """
Constraints come first: only configurations meeting the SLO are eligible, and among them you take
the highest throughput. Beyond that, scale horizontally with more replicas. A faster config that
breaks the SLO fails users, CPU inference is slower, and a longer queue delay increases latency further.
"""

[[questions]]
id = "07-17"
topic = "Streaming"
question = "Why do chat applications typically request streaming responses (\"stream\": true) from an LLM endpoint?"
options = [
  "Streaming makes the model generate tokens faster",
  "Streaming reduces the number of tokens generated",
  "Streaming is required for the OpenAI-compatible API",
  "Tokens are sent as they are generated (Server-Sent Events), so users see output after the time to first token instead of waiting for the whole answer",
]
answer = ["D"]
explanation = """
Total generation time is unchanged, but perceived latency drops dramatically because text appears
as soon as the first token is ready. Streaming doesn't speed up decoding or shorten outputs, and
the API supports both modes.
"""

[[questions]]
id = "07-18"
topic = "NIM API"
question = "An application already uses the OpenAI Python client. What is the simplest way to point it at a self-hosted NVIDIA NIM for LLMs?"
options = [
  "Rewrite the client to use the KServe v2 protocol",
  "Change the client's base URL to the NIM endpoint (for example http://nim-host:8000/v1) and set the model name the NIM serves",
  "Convert the model to ONNX first",
  "Install Triton client libraries",
]
answer = ["B"]
explanation = """
NIM for LLMs exposes OpenAI-compatible routes such as /v1/chat/completions and /v1/models, so
existing OpenAI clients work by changing the base URL and model name. KServe v2 is Triton's native
protocol, and no model conversion or Triton client is needed.
"""

[[questions]]
id = "07-19"
topic = "Rolling updates"
question = """
A Deployment has 4 GPU replicas on a cluster with no spare GPUs. The rollout must not need extra
GPUs. Which rolling-update settings allow the update, and what is the cost?
"""
options = [
  "maxSurge 0, maxUnavailable 1: no extra GPU is needed, but capacity temporarily drops to 3 ready replicas",
  "maxSurge 1, maxUnavailable 0: no extra GPU and no capacity loss",
  "maxSurge 0, maxUnavailable 0: the rollout proceeds normally",
  "Recreate strategy: no extra GPU and no downtime",
]
answer = ["A"]
explanation = """
Without spare GPUs, a new pod can only start after an old one frees its GPU, so capacity dips by
maxUnavailable during each step. maxSurge 1 needs a free GPU for the extra pod. With both at 0 the
rollout can't make progress, and Recreate stops all old pods first, which means downtime.
"""

[[questions]]
id = "07-20"
topic = "Blue-green"
question = "What is the main resource cost of a blue-green deployment for a GPU inference service?"
options = [
  "It needs no extra resources",
  "It requires CPU-only nodes",
  "It needs capacity for two full environments (old and new) during the switch-over, which for GPU services means roughly double the GPUs for that period",
  "It doubles the model's memory footprint permanently",
]
answer = ["C"]
explanation = """
Blue-green runs the new version fully alongside the old one and then switches traffic at once,
which gives instant rollback but temporarily needs two complete deployments. That's expensive with
GPUs, which is why rolling updates or canaries are common. The footprint returns to normal once the old environment is removed.
"""

[[questions]]
id = "07-21"
topic = "Reranking"
question = "Why is a cross-encoder reranker used after, rather than instead of, a bi-encoder (embedding) retriever?"
options = [
  "Cross-encoders cannot score relevance",
  "Bi-encoders are more accurate than cross-encoders",
  "Rerankers only work on images",
  "A cross-encoder scores each (query, passage) pair jointly, which is accurate but too slow to run over the whole corpus, so it reorders a small candidate set from the fast retriever",
]
answer = ["D"]
explanation = """
Bi-encoders embed documents once, offline, so search is fast, but relevance is judged from two
independent vectors. Cross-encoders read query and passage together, which is more precise but
needs one model call per pair. The two-stage design combines recall and speed with precision.
"""

[[questions]]
id = "07-22"
topic = "MIG"
question = """
Several small models each need only a few GB of GPU memory and little compute. Which feature lets
one A100 or H100 serve them with isolated memory and compute?
"""
options = [
  "Multi-Instance GPU (MIG), which partitions the GPU into isolated instances, each with its own memory and compute slices",
  "NVLink",
  "Tensor parallelism",
  "Pipeline parallelism",
]
answer = ["A"]
explanation = """
MIG splits one GPU into up to 7 hardware-isolated instances that Kubernetes schedules as separate
resources, which suits many small workloads with quality-of-service isolation. Time-slicing shares a
GPU without isolation. NVLink connects GPUs, and TP and PP split one large model across GPUs, the opposite need.
"""

[[questions]]
id = "07-23"
topic = "Model warm-up"
question = """
The first requests after each Triton pod starts are much slower than the rest (lazy initialisation,
CUDA graph capture, memory allocation). What reduces this?
"""
options = [
  "Disabling dynamic batching",
  "Configuring model warm-up (model_warmup in config.pbtxt) and gating readiness on it, so the pod receives traffic only after sample inferences have run",
  "Increasing max_queue_delay_microseconds",
  "Using the latest image tag",
]
answer = ["B"]
explanation = """
Warm-up requests run at load time, so one-off initialisation costs are paid before the readiness
probe passes. Batching and queue delay don't address cold starts, and image tags have nothing to do with them.
"""

[[questions]]
id = "07-24"
topic = "Stateful models"
question = "Which Triton scheduling feature ensures that all requests belonging to one stream (for example a streaming speech session) go to the same model instance, in order?"
options = [
  "Dynamic batching",
  "Instance groups",
  "Sequence batching, which tracks a correlation ID so a stateful model sees a sequence's requests in order on one instance",
  "Ensembles",
]
answer = ["C"]
explanation = """
Stateful models keep internal state between requests. The sequence batcher routes requests by
correlation ID and handles start and end flags. Dynamic batching groups independent requests,
instance groups add parallel copies, and ensembles chain models.
"""

[[questions]]
id = "07-25"
topic = "Capacity planning"
question = """
Traffic is 300 requests/s with an average latency of 0.4 s, and each replica handles 24 concurrent
requests efficiently. How many replicas are needed with 25% headroom?
"""
options = ["5", "6", "7", "8"]
answer = ["C"]
explanation = """
Little's law gives 300 × 0.4 = 120 requests in flight. With 25% headroom that's 150. 150 / 24 = 6.25,
which rounds up to 7 replicas. Without headroom it would be 120 / 24 = exactly 5.
"""

[[questions]]
id = "07-26"
topic = "GPU Operator"
question = "What does the NVIDIA GPU Operator do in a Kubernetes cluster?"
options = [
  "Automates deploying the NVIDIA driver, container toolkit, device plugin, DCGM exporter and related components on GPU nodes",
  "Trains models on Kubernetes",
  "Replaces the Kubernetes scheduler",
  "Provides an OpenAI-compatible API",
]
answer = ["A"]
explanation = """
The GPU Operator manages the software stack GPU nodes need: drivers, the container toolkit so pods
can access GPUs, the device plugin that advertises nvidia.com/gpu, monitoring through DCGM, and MIG
management. It doesn't train models, replace the scheduler, or serve APIs (that's NIM or Triton).
"""

[[questions]]
id = "07-27"
topic = "Serving LLMs with Triton"
question = "How is an LLM typically served with Triton for high performance?"
options = [
  "With the Python backend running Hugging Face generate() for every request",
  "As an ONNX model with dynamic batching",
  "With CPU instance groups",
  "With the TensorRT-LLM backend, which runs a compiled TensorRT-LLM engine with in-flight batching and a paged KV cache",
]
answer = ["D"]
explanation = """
The TensorRT-LLM backend brings the LLM-specific optimisations (continuous batching, paged KV,
quantized kernels) into Triton. A Python backend with generate() lacks them. Plain dynamic batching
is request-level, not token-level. CPU instances are far too slow for LLMs.
"""

[[questions]]
id = "07-28"
topic = "Container images"
question = "A Dockerfile for a Triton Python-backend model downloads the model weights at container start. Pods take minutes to become ready and fail when the internet is unreachable. What is the better practice?"
options = [
  "Download the weights at every request",
  "Bake the weights into the image at build time, or mount them from a volume or model cache, so pods start without network downloads",
  "Increase the liveness probe frequency",
  "Use the :latest base image",
]
answer = ["B"]
explanation = """
Start-up should be fast and self-contained. Pre-baked weights (as in this lab's Dockerfile) or a
shared volume or model cache avoid the network dependency and shorten cold starts. Per-request
downloads are absurd, more frequent liveness probes would kill loading pods sooner, and :latest makes builds unreproducible.
"""

[[questions]]
id = "07-29"
topic = "TensorRT engines"
question = """
A team builds a TensorRT engine (model.plan) for a BERT classifier on their L4 CI runners and copies
it into the Triton model repository on their new H100 inference servers. The model fails to load.
What is the correct fix?
"""
options = [
  "Build the engine on (or for) the H100 with the TensorRT version that the target Triton release uses",
  "Set instance_group kind to KIND_CPU so the plan runs without the GPU",
  "Increase max_batch_size in config.pbtxt so Triton re-optimizes the plan at load time",
  "Rename model.plan to model.onnx so Triton uses the ONNX Runtime backend instead",
]
answer = ["A"]
explanation = """
A TensorRT engine is compiled for a specific GPU architecture (L4 is sm_89, H100 is sm_90) and a
specific TensorRT version. It must be rebuilt for each target GPU and TensorRT release, usually in a
build step per platform. Triton never re-optimizes a plan; KIND_CPU cannot run a TensorRT engine; a
plan file is not an ONNX model, so renaming it only produces a different load error.
"""

[[questions]]
id = "07-30"
topic = "TensorRT engines"
question = """
An engine was built with trtexec using --minShapes=input_ids:1x128 --optShapes=input_ids:4x128
--maxShapes=input_ids:8x128. The Triton config for it says max_batch_size: 16. What happens, and what
are valid fixes? (Select TWO)
"""
options = [
  "Triton refuses to load the model because max_batch_size exceeds the engine's optimization profile",
  "Rebuild the engine with --maxShapes batch 16, or lower max_batch_size to 8 in config.pbtxt",
  "The model loads and Triton splits batches of 16 into two batches of 8 automatically",
  "Increase max_queue_delay_microseconds so batches never exceed 8",
  "Set preferred_batch_size: [ 16 ] so the engine learns the larger shape at runtime",
]
answer = ["A", "B"]
explanation = """
The optimization profile defines the shapes the engine supports. Triton checks that the configured
max_batch_size fits inside the profile and fails the load otherwise. Either rebuild with a larger
max shape or reduce max_batch_size. Triton does not split batches for TensorRT models, a queue delay
does not cap batch size, and engines never learn new shapes at runtime.
"""

[[questions]]
id = "07-31"
topic = "TensorRT engines"
question = """
An ONNX model already runs on Triton with the ONNX Runtime backend. The team wants lower latency on
their NVIDIA GPUs this sprint, with the least engineering effort and no separate engine build
pipeline. What should they do?
"""
options = [
  "Enable the TensorRT execution accelerator in the model's optimization block (gpu_execution_accelerator with precision_mode FP16)",
  "Rewrite the model as a Python backend that calls PyTorch",
  "Move the model to KIND_CPU instances and add more replicas",
  "Increase max_queue_delay_microseconds to 50000 to form larger batches",
]
answer = ["A"]
explanation = """
ONNX Runtime can hand supported subgraphs to TensorRT through the execution accelerator settings in
config.pbtxt. It needs one config block and no engine management, at the cost of a slower first load
while TensorRT builds its engine. A Python/PyTorch backend is usually slower, CPU instances are
slower still, and a long queue delay increases latency rather than reducing it.
"""

[[questions]]
id = "07-32"
topic = "Model control"
question = """
Production Triton servers must pick up a corrected config.pbtxt and a new model version without
restarting the server, and only when the deployment pipeline says so (never because a file appeared
half-copied in the repository). Which setup fits?
"""
options = [
  "Run with --model-control-mode=explicit and call the repository load API (POST /v2/repository/models/<name>/load) from the pipeline",
  "Run with --model-control-mode=poll so Triton loads every change it detects",
  "Run with the default mode and restart the Triton pod after every change",
  "Set version_policy to all so Triton reloads automatically on every change",
]
answer = ["A"]
explanation = """
Explicit mode loads and unloads models only through the API, so the pipeline decides when a change
takes effect and a load reloads an already loaded model with its new config. Poll mode applies
whatever it sees, including partially written files. Restarting works but causes downtime and is
not what was asked. version_policy chooses which versions are served; it does not trigger reloads.
"""

[[questions]]
id = "07-33"
topic = "Instance groups"
question = """
A Python-backend model is configured with instance_group [ { count: 2 kind: KIND_CPU } ] to keep
the GPU free for another model. nvidia-smi still shows the Python model using GPU memory. Why?
"""
options = [
  "A Python model places tensors where its own code decides; it must read args['model_instance_kind'] (and the device id) in initialize() to honour KIND_CPU",
  "KIND_CPU is ignored whenever max_batch_size is greater than zero",
  "Triton always places Python models on GPU 0 regardless of the configuration",
  "The dynamic batcher moves batches to the GPU automatically",
]
answer = ["A"]
explanation = """
For framework backends Triton places the model on the requested device. A Python backend runs your
code, and Triton passes the instance kind and device id in initialize(args); if the code moves the
model to cuda unconditionally, it uses the GPU anyway. max_batch_size and the dynamic batcher have no
effect on device placement, and Python models are not forced onto GPU 0.
"""

