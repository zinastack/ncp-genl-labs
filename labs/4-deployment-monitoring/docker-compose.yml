# Section 4 stack (GPU instance): Triton (Lab 07) + DCGM exporter + Prometheus + Grafana (Lab 08).
#   make triton-up     → build & start everything
#   make triton-down   → stop
# Ports: Triton 8000/8001/8002 · Prometheus 9090 · Grafana 3000 · DCGM 9400
services:
  triton:
    build:
      context: 07-model-deployment/triton
      args: {TRITON_VERSION: "${TRITON_VERSION:-24.12}"}
    image: genl-labs/triton-textclf:${TRITON_VERSION:-24.12}
    command: ["tritonserver", "--model-repository=/models", "--strict-readiness=true", "--log-verbose=0"]
    volumes:
      - ./07-model-deployment/triton/model_repository:/models   # edit config.pbtxt, then restart
    ports: ["8000:8000", "8001:8001", "8002:8002"]
    shm_size: 1g
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:8000/v2/health/ready"]
      interval: 10s
      retries: 30

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
    cap_add: [SYS_ADMIN]
    ports: ["9400:9400"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./08-monitoring-reliability/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triton.json
    volumes:
      - ./08-monitoring-reliability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./08-monitoring-reliability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
