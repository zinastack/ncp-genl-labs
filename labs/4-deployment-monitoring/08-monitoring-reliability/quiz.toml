domain = "Production Monitoring & Reliability"
code = "08"
weight = 7

[[questions]]
id = "08-01"
topic = "Latency metrics"
question = """
A dashboard shows average latency of 180 ms for an LLM API, well within the 500 ms target, yet
users complain about slowness. Which metric change would best reveal the problem?
"""
options = [
  "Track tail percentiles (P95/P99) computed from latency histograms, plus TTFT and inter-token latency for streaming",
  "Report the median of daily averages",
  "Track only the total requests per second",
  "Average the P99 values reported by each replica",
]
answer = ["A"]
explanation = """
Averages hide the long tail that users feel. P95 and P99 expose it, and for LLMs TTFT and
inter-token latency describe perceived responsiveness better than total time. Percentiles must be
computed from aggregated histograms. Averaging per-replica P99s is statistically wrong.
"""

[[questions]]
id = "08-02"
topic = "Data drift"
question = """
The population stability index (PSI) of prompt-length and topic-embedding features between the
training set and last week's traffic is 0.34. What does this indicate, and what is the
appropriate response?
"""
options = [
  "Significant input drift; trigger an evaluation on recent labelled samples and, if quality has dropped, retrain or fine-tune with recent data through the normal evaluation gates",
  "No drift; PSI above 0.25 means the distributions are identical",
  "The model is overfitting; immediately reduce its size",
  "Only a monitoring bug; PSI can't be computed on text",
]
answer = ["A"]
explanation = """
PSI above 0.25 is conventionally significant drift (below 0.1 is stable, 0.1–0.25 is moderate).
Drift is a trigger to investigate. Confirm the impact on quality with evaluation, then retrain
with recent data and promote only after the same gates. PSI works on any binned feature,
including embedding projections, lengths and topic distributions.
"""

[[questions]]
id = "08-03"
topic = "Rollout strategies"
question = """
You want to validate a new model version on real production traffic with zero impact on users
before any exposure. Which strategy fits?
"""
options = [
  "Shadow deployment: mirror live requests to the new model and log its outputs without returning them to users",
  "Canary release to 10% of users",
  "Blue-green switch of all traffic",
  "Direct replacement during a maintenance window",
]
answer = ["A"]
explanation = """
Shadow (mirrored) traffic exercises the new model on real inputs for latency, errors and output
comparison while users only ever see the current model's responses. Canary and blue-green
expose some or all users. A direct replacement has no validation step.
"""

[[questions]]
id = "08-04"
topic = "Canary analysis"
question = """
A canary serving 5% of traffic shows P95 latency 35% higher and an error rate 4× the stable
version's over the same time window. What should the automated rollout do?
"""
options = [
  "Halt and roll back the canary automatically, and keep the logs and metrics for investigation",
  "Promote it to 100% so the latency averages out",
  "Increase the canary to 50% to collect more data",
  "Ignore it, since a 5% sample is too small to matter",
]
answer = ["A"]
explanation = """
Canary analysis compares both versions over the same window against predefined thresholds.
Clear regressions in latency and errors should trigger an automatic rollback. Expanding exposure
or promoting would harm more users. A 5% slice of production traffic is usually enough to detect
a fourfold error increase.
"""

[[questions]]
id = "08-05"
topic = "SLO burn rate"
question = """
Your SLO is 99.9% successful requests over 30 days. Which alerting approach best balances fast
detection of serious incidents with few false pages?
"""
options = [
  "Multi-window burn-rate alerts: page when both a short window (for example 5 min) and a longer window (for example 1 h) burn the error budget at ≥14.4×, and open a ticket for slower burns",
  "Page whenever a single request fails",
  "Page only when the monthly error budget is completely exhausted",
  "Alert on CPU usage above 80%",
]
answer = ["A"]
explanation = """
Burn rate (error rate ÷ allowed error rate) ties alerts to user impact. Requiring both a short
and a long window filters brief blips while catching sustained fast burns within minutes. Slow
burns go to tickets. Per-request paging is noise. Waiting for full exhaustion is too late. CPU is
a cause, not a symptom.
"""

[[questions]]
id = "08-06"
topic = "Triton metrics"
question = """
From Triton metrics, nv_inference_count increased by 12,000 and nv_inference_exec_count by 1,500
over the last minute. What does this tell you?
"""
options = [
  "Dynamic batching is forming batches of about 8 requests on average",
  "1,500 requests failed",
  "The GPU is 12.5% utilised",
  "Queue time averages 8 ms",
]
answer = ["A"]
explanation = """
nv_inference_count counts inferences (batch items) and nv_inference_exec_count counts model
executions (batches). Their ratio is the average executed batch size: 12,000 / 1,500 = 8. Failures
are in nv_inference_request_failure, GPU utilisation is in nv_gpu_utilization or DCGM, and queue
time is nv_inference_queue_duration_us divided by successful requests.
"""

[[questions]]
id = "08-07"
topic = "Automated retraining"
question = "Which elements belong in a safe automated retraining pipeline for a production LLM? (Select TWO.)"
options = [
  "Triggers based on drift, monitored quality degradation, or accumulated new labelled data",
  "Evaluation gates (task metrics, safety and regression suites) that a new version must pass before registry promotion and a canary rollout",
  "Automatic deployment of every retrained model straight to 100% of traffic",
  "Deleting previous model versions to save storage",
  "Retraining every hour regardless of data or metrics",
]
answer = ["A", "B"]
explanation = """
Retraining should happen for a reason and never bypass evaluation. A new version must beat or
match the incumbent on gated evaluations, then roll out progressively. Keeping previous versions
enables rollback. Blind hourly retraining wastes compute and risks regressions.
"""

[[questions]]
id = "08-08"
topic = "Version management"
question = """
After deploying fine-tuned model v7, output quality drops. Investigation shows the weights are
fine but the chat template and system prompt used in production differ from those used in
evaluation. What practice would have prevented this?
"""
options = [
  "Version and release the model artifact together with its tokenizer, prompt templates, generation parameters and guardrail configuration in the registry",
  "Use a larger model",
  "Monitor only GPU utilisation",
  "Store models without version numbers to simplify deployment",
]
answer = ["A"]
explanation = """
An LLM's behaviour depends on the whole serving configuration, not just its weights. Treating
prompts, templates, sampling parameters and guardrails as versioned artifacts with lineage keeps
evaluation and production consistent and makes rollback exact.
"""

[[questions]]
id = "08-09"
topic = "GPU health"
question = """
One node in an inference cluster occasionally returns corrupted outputs and later crashes. DCGM
reports non-zero XID errors and rising ECC error counts on one GPU. What is the correct operational
response?
"""
options = [
  "Cordon and drain the node, take the GPU out of service for diagnostics (for example dcgmi diag), and let the scheduler move workloads to healthy nodes",
  "Increase the batch size on that node",
  "Ignore it; ECC errors are always corrected",
  "Restart the model server every hour",
]
answer = ["A"]
explanation = """
XID and ECC errors point to hardware or driver faults. The node must be removed from rotation
(Kubernetes cordon and drain), and DCGM diagnostics run. Uncorrectable errors corrupt results,
and restarts only hide the symptom.
"""

[[questions]]
id = "08-10"
topic = "Reliability patterns"
question = """
A downstream LLM endpoint sometimes becomes very slow, and your API's worker threads pile up
waiting on it, taking the whole service down. Which patterns address this? (Select TWO.)
"""
options = [
  "Client timeouts with bounded retries and exponential back-off with jitter",
  "A circuit breaker that fails fast and serves a fallback (smaller model or cached answer) while the dependency is unhealthy",
  "Unlimited retries on every failure",
  "Removing all timeouts so requests eventually succeed",
  "Scaling the API tier to 10× its current size",
]
answer = ["A", "B"]
explanation = """
Timeouts and bounded retries keep slow dependencies from exhausting resources, and jitter avoids
synchronised retry storms. A circuit breaker stops calling a failing dependency and degrades
gracefully. Unlimited retries and no timeouts amplify the outage. Scaling the API tier doesn't fix
a slow dependency and can overload it further.
"""

[[questions]]
id = "08-11"
topic = "Aggregating percentiles"
question = """
Ten inference replicas each export latency as a Prometheus histogram. How should the service-wide
P95 latency be computed?
"""
options = [
  "Sum the bucket counters across replicas (by le), then compute the quantile from the merged histogram, e.g. histogram_quantile(0.95, sum by (le) (rate(latency_bucket[5m])))",
  "Average the P95 values reported by each replica",
  "Take the maximum of the replicas' P95 values",
  "Take the median replica's P95",
]
answer = ["A"]
explanation = """
Percentiles don't average: a small, slow replica would get the same weight as a large, fast one.
In this lab's example the average of two P95s is 0.48 s while the true merged P95 is 0.33 s.
Histogram buckets are counts, which add up correctly across replicas. The max and median of
per-replica values are also not the service's P95.
"""

[[questions]]
id = "08-12"
topic = "Counters and rate"
question = "Why are Triton metrics such as nv_inference_request_success usually queried with rate() in PromQL?"
options = [
  "rate() converts them to percentiles",
  "They are counters that only increase since the server started; rate() gives the per-second increase over a recent window, which is what dashboards and alerts need",
  "rate() is required to read any Prometheus metric",
  "rate() removes GPU metrics from the result",
]
answer = ["B"]
explanation = """
A counter's raw value is a lifetime total and mostly reflects uptime. rate() over a window such as
[1m] turns it into current throughput, and ratios of rates give averages (queue time per request,
batch size). Gauges such as GPU utilisation are read directly. rate() doesn't compute percentiles.
"""

[[questions]]
id = "08-13"
topic = "Circuit breaker"
question = "In the circuit-breaker pattern, what happens in the half-open state?"
options = [
  "All requests are rejected permanently",
  "Requests are sent to two dependencies at once",
  "After the cool-down, a limited trial request is allowed through; success closes the circuit, failure re-opens it",
  "The breaker restarts the failing service",
]
answer = ["C"]
explanation = """
Open means failing fast without calling the dependency. After the reset timeout the breaker lets a
probe through (half-open) to check whether the dependency has recovered, then closes or re-opens.
It never rejects permanently, doesn't duplicate requests, and doesn't restart services.
"""

[[questions]]
id = "08-14"
topic = "Retry jitter"
question = """
After a brief outage, all clients retry with the same fixed exponential backoff, and the service
is knocked down again by synchronised waves of retries. What fixes this?
"""
options = [
  "Remove all retries",
  "Retry immediately without delay",
  "Use a constant 1-second delay for every retry",
  "Add jitter: randomise each retry's delay (for example uniformly between 0 and the exponential bound) so clients spread out",
]
answer = ["D"]
explanation = """
Identical schedules synchronise clients into a thundering herd. Full jitter decorrelates them while
keeping the exponential growth of the bound. Removing retries loses resilience, and immediate or
constant delays keep the waves aligned.
"""

[[questions]]
id = "08-15"
topic = "Idempotency"
question = "Which requests are safe to retry automatically after a timeout?"
options = [
  "Idempotent requests, whose repeated execution has the same effect as one (for example a stateless inference call), or requests made idempotent with an idempotency key",
  "Any request, because retries never cause side effects",
  "Only requests that failed with HTTP 400",
  "Only requests larger than 1 MB",
]
answer = ["A"]
explanation = """
A timeout doesn't tell you whether the server executed the request. Retrying a non-idempotent
operation (charging a card, sending an email, an agent's tool action) can do it twice. Pure
inference calls are naturally safe. 4xx errors are usually client mistakes that retrying won't fix, and size is irrelevant.
"""

[[questions]]
id = "08-16"
topic = "Text drift"
question = "How can input drift be monitored for an LLM application whose inputs are free text?"
options = [
  "It cannot; drift only applies to numeric features",
  "Compare embeddings of recent prompts with a reference period (centroid distance, cluster or topic mix), plus simple statistics such as prompt length and language mix",
  "Measure GPU temperature",
  "Count the number of model replicas",
]
answer = ["B"]
explanation = """
Embeddings turn text into vectors, so distribution shift becomes measurable: distances between
centroids, changes in cluster proportions, or PSI on cluster assignments. Length and language
distributions are cheap extra signals. GPU temperature and replica counts are operational metrics, not input drift.
"""

[[questions]]
id = "08-17"
topic = "Concept drift"
question = "What distinguishes concept drift from data (covariate) drift?"
options = [
  "Concept drift only happens on GPUs",
  "Concept drift means the input distribution changed; data drift means the labels changed",
  "They are the same thing",
  "Concept drift means the relationship between inputs and the correct output changes (the same input now needs a different answer); it usually needs labels or feedback to detect, unlike input drift",
]
answer = ["D"]
explanation = """
Data drift is a change in what inputs look like, detectable without labels (PSI, KS, embeddings).
Concept drift is a change in what the right answer is, for example a new policy that makes old
answers wrong. It shows up in quality metrics, labels and user feedback, so monitoring must include
outcome signals, not just input statistics.
"""

[[questions]]
id = "08-18"
topic = "Shadow deployment"
question = "What is the main cost of a shadow deployment for an LLM service?"
options = [
  "Users see the new model's possibly wrong answers",
  "It requires deleting the current model",
  "Every mirrored request is processed twice, roughly doubling inference compute (GPU cost) for the shadowed traffic",
  "It cannot measure latency",
]
answer = ["C"]
explanation = """
Shadow traffic is invisible to users, since their answers come from the current model, but the new
model does real work on real inputs, which costs GPU time. You can shadow a sample of traffic to
limit this. It needs no deletion, and it's a good way to measure the new model's latency and outputs.
"""

[[questions]]
id = "08-19"
topic = "Alerting practice"
question = "Which alerting practices reduce noise while catching real incidents? (Select TWO.)"
options = [
  "Alert on user-facing symptoms (latency SLOs, error rates, burn rate) rather than on every internal cause",
  "Attach a runbook to every alert, describing what it means and what to do first",
  "Page on every single failed request",
  "Page when CPU usage exceeds 80% on GPU inference nodes",
  "Disable alerts at night",
]
answer = ["A", "B"]
explanation = """
Symptom-based alerts fire when users are affected, and runbooks make them actionable. Per-request
paging creates alert fatigue, CPU is a poor saturation signal for GPU inference, and disabling
alerts at night leaves outages unnoticed.
"""

[[questions]]
id = "08-20"
topic = "LLM SLOs"
question = "Which service-level indicators best capture the user experience of a streaming chat assistant? (Select TWO.)"
options = [
  "Time to first token (TTFT) at a high percentile",
  "Inter-token latency (ITL / time per output token) at a high percentile",
  "Total GPU memory installed",
  "Number of model parameters",
  "Average CPU utilisation",
]
answer = ["A", "B"]
explanation = """
In streaming chat, users feel how quickly text starts and how smoothly it flows. Tail TTFT and ITL
measure both, and error rate completes the picture. Installed memory, parameter count and CPU
utilisation describe the deployment, not the experience.
"""

[[questions]]
id = "08-21"
topic = "ECC errors"
question = "What is the difference between single-bit and double-bit ECC errors reported by DCGM?"
options = [
  "Single-bit errors are corrected by the hardware (worth trending); double-bit errors are uncorrectable and can corrupt results, so the GPU should be drained and diagnosed",
  "Both are always corrected automatically",
  "Double-bit errors are harmless; single-bit errors crash the GPU",
  "ECC errors only affect CPU memory",
]
answer = ["A"]
explanation = """
ECC corrects single-bit flips, and a rising rate is an early warning. Double-bit (DBE) errors are
detected but can't be corrected, so outputs may be wrong. Remove the GPU from service (drain the
node) and run DCGM diagnostics. GPU HBM has its own ECC, separate from CPU memory.
"""

[[questions]]
id = "08-22"
topic = "Quality monitoring"
question = """
Latency and error rates are healthy, but you need to know whether answer quality is degrading in
production. Which signals help? (Select TWO.)
"""
options = [
  "Explicit user feedback (thumbs up/down, corrections) tracked per model version",
  "Periodic LLM-as-judge or human review of a sample of production conversations against a rubric",
  "GPU fan speed",
  "The number of Kubernetes namespaces",
  "Container image size",
]
answer = ["A", "B"]
explanation = """
Quality isn't visible in infrastructure metrics. Direct feedback and scored samples (a judge
calibrated against humans, Lab 09) reveal regressions and concept drift. Fan speed, namespaces and
image size tell you nothing about answers.
"""

[[questions]]
id = "08-23"
topic = "Graceful degradation"
question = """
The primary 70B model's cluster is overloaded during a traffic spike. Which strategy keeps the
service useful rather than failing requests?
"""
options = [
  "Return HTTP 500 for all requests until the spike ends",
  "Graceful degradation: route overflow or non-critical traffic to a smaller fallback model or cached answers, with rate limiting and priorities",
  "Disable all monitoring to save resources",
  "Increase max_tokens for every request",
]
answer = ["B"]
explanation = """
A smaller model, cached responses or reduced features keep users served at lower quality, while
rate limits protect the primary system. Blanket errors fail everyone, disabling monitoring hides the
problem, and longer outputs increase load.
"""

[[questions]]
id = "08-24"
topic = "A/B testing"
question = "When is an A/B test the right tool for comparing two model versions, rather than a canary alone?"
options = [
  "When you only need to check that the new version doesn't crash",
  "When you want zero user exposure",
  "When you need a statistically sound comparison of user or business outcomes (for example task success or retention) between versions, with enough traffic and time for significance",
  "When the two versions have different tokenizers",
]
answer = ["C"]
explanation = """
A canary is a safety check (latency, errors) on a small slice before full rollout. An A/B test
randomly assigns users to measure which version performs better on outcomes, which needs sample
size and duration. Crash checks are canary territory, zero exposure means shadow, and tokenizers are irrelevant.
"""
