groups:
  - name: inference
    rules:
      # Recording rules: turn counters into per-request averages (same maths as the exercises).
      - record: triton:avg_queue_ms
        expr: 1e-3 * sum by (model) (rate(nv_inference_queue_duration_us[1m])) / sum by (model) (rate(nv_inference_request_success[1m]))
      - record: triton:avg_compute_ms
        expr: 1e-3 * sum by (model) (rate(nv_inference_compute_infer_duration_us[1m])) / sum by (model) (rate(nv_inference_request_success[1m]))
      - record: triton:avg_batch_size
        expr: sum by (model) (rate(nv_inference_count[1m])) / sum by (model) (rate(nv_inference_exec_count[1m]))
      - record: triton:error_ratio
        expr: sum by (model) (rate(nv_inference_request_failure[5m])) / (sum by (model) (rate(nv_inference_request_success[5m])) + sum by (model) (rate(nv_inference_request_failure[5m])))

      - alert: TritonQueueTimeHigh
        expr: triton:avg_queue_ms > 10
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.model }} requests wait {{ $value | printf \"%.1f\" }} ms in queue: saturated, scale out or tune batching"

      - alert: TritonErrorBudgetFastBurn     # SLO 99.9% → 14.4x burn
        expr: triton:error_ratio > 14.4 * 0.001
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.model }} is burning its error budget 14x too fast"

      - alert: GPUMemoryNearlyFull
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.95
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory > 95%"

      - alert: GPUXidErrors
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels: {severity: page}
        annotations:
          summary: "XID error {{ $value }} on GPU {{ $labels.gpu }}: check hardware / driver"
